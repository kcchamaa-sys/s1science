name: Data tests
# Runs on every push and pull request: checks that XP, streaks, collections and the class board stay correct.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server data tests
        run: node tools/test_server.js
      - name: Install headless browser
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Game data tests
        run: node tools/test_client.js
