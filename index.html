M(4,'If bees became extinct, which is the MOST likely result?','如果蜜蜂滅絕，最可能出現甚麼後果？',[['Many flowering plants and crops could not be pollinated','很多有花植物和農作物無法傳粉'],['There would be more fruits','會有更多果實'],['Nothing would change','甚麼也不會改變'],['Rivers would dry up','河流會乾涸']],'Living things depend on one another – losing one affects others.','生物互相依賴，失去一種會影響其他生物。'),
M(4,'Why does higher biodiversity make an ecosystem more stable?','為甚麼生物多樣性較高會令生態系統較穩定？',[['If one species declines, others can fill its role','如果一種生物減少，其他生物可以取代牠的角色'],['There are fewer living things','生物較少'],['Pollution stops','污染會停止'],['All animals eat the same food','所有動物吃同一種食物']],'More variety = more backup.','種類越多，後備越多。'),
M(5,'A new road is planned through a stream where Romer\'s Tree Frogs live. Which is the BEST decision?','計劃興建一條穿過盧氏小樹蛙棲息溪流的新道路，哪個決定最好？',[['Change the route or build protected passages, and conduct an environmental study first','改道或建造保護通道，並先進行環境評估'],['Build the road anyway','照樣興建道路'],['Move all frogs into tanks forever','把所有青蛙永遠放入水族箱'],['Fill the stream with concrete','用混凝土填平溪流']],'Balance development with conservation – sustainable development.','平衡發展和保育，即可持續發展。'),
M(6,'Plan a class project to help the Black-faced Spoonbill. Which is MOST useful?','策劃一個幫助黑臉琵鷺的班級專題，哪個最有用？',[['Research its threats, share findings, and support wetland protection (e.g. Mai Po)','研究牠面對的威脅，分享結果，並支持保護濕地（例如米埔）'],['Catch one as a class pet','捉一隻當班寵'],['Feed it bread at the beach','在海灘餵牠麵包'],['Ignore it because it is only a bird','不理會，因為牠只是一隻鳥']],'Knowledge + protecting habitats helps most.','知識加上保護生境最有幫助。')
]}
]},
{id:4,en:'Cells, human reproduction & heredity',zh:'細胞、人類生殖和遺傳',col:'#E8DDF5',ink:'#8A6BB5',icon:'cell',sections:[
{id:'4.1',en:'Cells',zh:'細胞',
notes:[['<b>Cells</b> are the basic units of living things.','<b>細胞</b>是生物的基本單位。'],
['Total magnification = <b>eyepiece × objective</b>. The image in a light microscope is <b>magnified and inverted</b>.','總放大率＝<b>目鏡放大率 × 物鏡放大率</b>。光學顯微鏡的影像是<b>放大及倒轉</b>的。'],
['Both plant & animal cells: <b>cell membrane</b> (controls substances in/out), <b>cytoplasm</b> (chemical reactions), <b>nucleus</b> (genetic material, controls activities).','植物和動物細胞都有：<b>細胞膜</b>（控制物質進出）、<b>細胞質</b>（進行化學反應）、<b>細胞核</b>（含遺傳物質，控制細胞活動）。'],
['Plant cells only: <b>cell wall</b> (support, regular shape), <b>large vacuole</b>, <b>chloroplasts</b> (chlorophyll, photosynthesis; in green parts).','只有植物細胞有：<b>細胞壁</b>（支持、形狀規則）、<b>大液泡</b>、<b>葉綠體</b>（含葉綠素，進行光合作用；在綠色部分）。']],
terms:[['cell','細胞'],['microscope','顯微鏡'],['magnification','放大率'],['cell wall','細胞壁'],['cell membrane','細胞膜'],['cytoplasm','細胞質'],['nucleus','細胞核'],['vacuole','液泡'],['chloroplast','葉綠體']],
qs:[
M(1,'What are the basic units of living things?','生物的基本單位是甚麼？',[['Cells','細胞'],['Atoms of water','水分子'],['Organs','器官'],['Bones','骨骼']],'All living things are made of cells.','所有生物都由細胞組成。'),
M(1,'Which part controls the activities of a cell?','細胞哪部分控制細胞的活動？',[['Nucleus','細胞核'],['Cell wall','細胞壁'],['Vacuole','液泡'],['Cytoplasm','細胞質']],'It contains genetic material.','它含有遺傳物質。'),
M(1,'Where does photosynthesis take place?','光合作用在哪裏進行？',[['Chloroplasts','葉綠體'],['Nucleus','細胞核'],['Cell membrane','細胞膜'],['Vacuole','液泡']],'Chloroplasts contain chlorophyll.','葉綠體含有葉綠素。'),
T(2,'Animal cells have a cell wall.','動物細胞有細胞壁。',false,'Only plant cells have a cell wall.','只有植物細胞有細胞壁。'),
T(2,'The image seen in a light microscope is inverted.','光學顯微鏡中看到的影像是倒轉的。',true,'Moving the slide left makes the image move right.','把玻片向左移，影像會向右移。'),
M(2,'Which part controls the movement of substances into and out of the cell?','哪部分控制物質進出細胞？',[['Cell membrane','細胞膜'],['Cell wall','細胞壁'],['Chloroplast','葉綠體'],['Nucleus','細胞核']],'The membrane is a selective barrier.','細胞膜有選擇性地讓物質通過。'),
M(3,'Eyepiece ×10, objective ×40. What is the total magnification?','目鏡 ×10，物鏡 ×40，總放大率是多少？',[['×400','×400'],['×50','×50'],['×4','×4'],['×30','×30']],'10 × 40 = 400.','10 × 40 = 400。'),
M(3,'A cell has a nucleus, cell membrane and cytoplasm, but NO cell wall. It is most likely…','一個細胞有細胞核、細胞膜和細胞質，但沒有細胞壁。它最可能是……',[['a human cheek cell','人類口腔皮膜細胞'],['an onion cell','洋葱細胞'],['a leaf cell','葉細胞'],['a moss cell','苔蘚細胞']],'No cell wall → animal cell.','沒有細胞壁 → 動物細胞。'),
M(4,'Onion epidermis cells have no chloroplasts. Why?','洋葱表皮細胞沒有葉綠體，為甚麼？',[['They are not in a green part exposed to light','它們不在接觸光線的綠色部分'],['They are animal cells','它們是動物細胞'],['They have no nucleus','它們沒有細胞核'],['Chloroplasts melt','葉綠體熔化了']],'Only cells in green parts have chloroplasts.','只有綠色部分的細胞才有葉綠體。'),
M(4,'The specimen appears at the top-left of the view. To move it to the centre, move the slide…','標本出現在視野的左上方，要把它移到中央，應把玻片移向……',[['top-left','左上方'],['bottom-right','右下方'],['top-right','右上方'],['bottom-left','左下方']],'Image is inverted, so move the slide the same way the image appears.','影像倒轉，所以影像在哪方便把玻片移向那方。'),
M(5,'A student says "A plant cell is just an animal cell with extra parts." Which extra parts make this MOSTLY true?','學生說「植物細胞只是多了一些部分的動物細胞」。哪些額外部分令這說法大致正確？',[['Cell wall, large vacuole and chloroplasts','細胞壁、大液泡和葉綠體'],['Nucleus and cytoplasm','細胞核和細胞質'],['Cell membrane only','只有細胞膜'],['Bones and blood','骨和血液']],'Both share nucleus, cytoplasm, membrane.','兩者都有細胞核、細胞質和細胞膜。'),
M(6,'You want to see cheek cells clearly under a microscope. Which step helps MOST?','你想在顯微鏡下清楚看到口腔皮膜細胞，哪一步最有幫助？',[['Stain the cells (e.g. with methylene blue) and start with the low-power objective','把細胞染色（例如用亞甲藍）並先用低倍物鏡'],['Use the highest power first without focusing','先用最高倍數而不對焦'],['Add a thick layer of cells','放厚厚一層細胞'],['Turn off the light','關掉光源']],'Stain adds contrast; low power helps find the cells.','染色增加對比；低倍數有助找到細胞。')
]},
{id:'4.2',en:'From a single cell to a multicellular organism',zh:'由單一細胞到多細胞生物',
notes:[['Cells <b>divide</b> (nucleus divides first, then two new cells form), <b>grow</b> (take in nutrients) and <b>differentiate</b> (become specialized).','細胞會<b>分裂</b>（細胞核先分裂，再形成兩個新細胞）、<b>生長</b>（吸收養分）和<b>分化</b>（變得專門化）。'],
['Levels of organization: <b>cell → tissue → organ → system → organism</b>.','組織層次：<b>細胞 → 組織 → 器官 → 系統 → 生物個體</b>。'],
['<b>DNA</b> is the genetic material; it carries genetic information that instructs cell activities. DNA is a <b>double helix</b>.','<b>DNA</b>是遺傳物質，攜帶指示細胞活動的遺傳信息。DNA 呈<b>雙螺旋</b>結構。'],
['A <b>chromosome</b> contains a long coil of DNA; DNA has 4 <b>bases</b> (A, T, C, G); a specific sequence of bases makes up a <b>gene</b>.','<b>染色體</b>含有一條長而捲曲的 DNA；DNA 有四種<b>鹼基</b>（A、T、C、G）；鹼基的特定排列組成<b>基因</b>。']],
terms:[['cell division','細胞分裂'],['cell differentiation','細胞分化'],['chromosome','染色體'],['DNA','去氧核糖核酸'],['double helix','雙螺旋'],['base','鹼基'],['gene','基因'],['tissue','組織'],['organ','器官']],
qs:[
M(1,'What is the correct order of the levels of organization?','組織層次的正確次序是甚麼？',[['Cell → tissue → organ → system','細胞 → 組織 → 器官 → 系統'],['Tissue → cell → system → organ','組織 → 細胞 → 系統 → 器官'],['Organ → cell → tissue → system','器官 → 細胞 → 組織 → 系統'],['System → organ → cell → tissue','系統 → 器官 → 細胞 → 組織']],'From small to large.','由小至大。'),
M(1,'DNA has the shape of a…','DNA 的形狀是……',[['double helix','雙螺旋'],['cube','立方體'],['single straight line','單一直線'],['ring','環形']],'Two strands twisted together.','兩條鏈互相扭纏。'),
M(1,'How many kinds of bases are found in DNA?','DNA 有多少種鹼基？',[['4','4'],['2','2'],['20','20'],['46','46']],'A, T, C, G.','A、T、C、G。'),
T(2,'In cell division, the nucleus divides into two.','在細胞分裂時，細胞核會一分為二。',true,'Then the cytoplasm separates to form two cells.','然後細胞質分開，形成兩個細胞。'),
T(2,'Cell differentiation means cells become bigger.','細胞分化是指細胞變大。',false,'Differentiation = becoming specialized; getting bigger is cell growth.','分化＝變得專門化；變大是細胞生長。'),
M(2,'The heart is made of muscle, nerve and other tissues working together. The heart is an…','心臟由肌肉、神經等組織一起運作組成。心臟是一個……',[['organ','器官'],['tissue','組織'],['cell','細胞'],['system','系統']],'Different tissues → organ.','不同組織 → 器官。'),
M(2,'A specific sequence of bases on DNA that makes up a unit of genetic information is a…','DNA 上一段特定排列的鹼基組成一個遺傳信息單位，稱為……',[['gene','基因'],['chromosome','染色體'],['nucleus','細胞核'],['tissue','組織']],'Chromosome ⊃ DNA ⊃ genes.','染色體 ⊃ DNA ⊃ 基因。'),
M(3,'Red blood cells have no nucleus and carry oxygen. This is an example of…','紅血球沒有細胞核並負責運送氧，這是甚麼的例子？',[['cell differentiation','細胞分化'],['cell division','細胞分裂'],['a tissue','組織'],['a gene','基因']],'They are specialized for a function.','它們專門執行某種功能。'),
M(3,'Where are chromosomes found in a cell?','染色體在細胞的哪部分？',[['Nucleus','細胞核'],['Cell wall','細胞壁'],['Vacuole','液泡'],['Cell membrane','細胞膜']],'The nucleus contains the genetic material.','細胞核含有遺傳物質。'),
M(4,'Which order of size is correct, from LARGEST to SMALLEST?','由最大至最小，哪個次序正確？',[['Chromosome → DNA → gene → base','染色體 → DNA → 基因 → 鹼基'],['Gene → chromosome → base → DNA','基因 → 染色體 → 鹼基 → DNA'],['Base → gene → DNA → chromosome','鹼基 → 基因 → DNA → 染色體'],['DNA → chromosome → base → gene','DNA → 染色體 → 鹼基 → 基因']],'Chromosome contains DNA; genes are parts of DNA made of bases.','染色體含 DNA；基因是 DNA 的一部分，由鹼基組成。'),
M(4,'A zygote grows into a baby with trillions of cells. Which processes are MOST needed?','一個合子長成擁有數以萬億計細胞的嬰兒，最需要哪些過程？',[['Cell division, growth and differentiation','細胞分裂、生長和分化'],['Only cell growth','只有細胞生長'],['Only cell differentiation','只有細胞分化'],['Photosynthesis','光合作用']],'Division increases number; growth increases size; differentiation makes different cell types.','分裂增加數目；生長增加體積；分化產生不同種類的細胞。'),
M(5,'Which statement about levels of organization is CORRECT?','關於組織層次，哪個說法正確？',[['The digestive system has many organs working together','消化系統由多個器官一起運作'],['A tissue is made of different organs','組織由不同器官組成'],['A cell is made of systems','細胞由系統組成'],['An organ has only one type of cell','器官只有一種細胞']],'Systems are made of organs.','系統由器官組成。'),
M(6,'Build a model to show DNA base pairing. Which rule should your model follow?','建立模型展示 DNA 鹼基配對，你的模型應遵守哪條規則？',[['A pairs with T, and C pairs with G','A 與 T 配對，C 與 G 配對'],['A pairs with C, T pairs with G','A 與 C 配對，T 與 G 配對'],['Any base pairs with any base','任何鹼基可與任何鹼基配對'],['Bases do not pair','鹼基不會配對']],'Base pairing: A–T, C–G.','鹼基配對：A–T、C–G。')
]},
{id:'4.3',en:'Sex cells and reproductive systems',zh:'性細胞和生殖系統',
notes:[['Male sex cell: <b>sperm</b> (small, can move). Female sex cell: <b>ovum</b> (much larger, cannot move by itself).','男性性細胞：<b>精子</b>（細小、能自行移動）。女性性細胞：<b>卵</b>（大得多、不能自行移動）。'],
['Each sex cell has <b>23</b> chromosomes; sperm carries <b>X or Y</b>, ovum carries <b>X</b> only.','每個性細胞有 <b>23</b> 條染色體；精子帶 <b>X 或 Y</b>，卵只帶 <b>X</b>。'],
['Sperm + ovum fuse → <b>zygote</b> with <b>46</b> chromosomes. <b>XX = female</b>, <b>XY = male</b>.','精子與卵融合 → <b>合子</b>，有 <b>46</b> 條染色體。<b>XX＝女性</b>，<b>XY＝男性</b>。'],
['Male system: <b>testes</b> (make sperm & sex hormones), <b>sperm ducts</b>, <b>sex glands</b>, <b>urethra</b>, <b>penis</b>.','男性生殖系統：<b>睾丸</b>（產生精子和性激素）、<b>輸精管</b>、<b>性腺體</b>、<b>尿道</b>、<b>陰莖</b>。'],
['Female system: <b>ovaries</b> (release ova), <b>oviducts</b> (where fertilization occurs), <b>uterus</b> (where embryo develops), <b>vagina</b>.','女性生殖系統：<b>卵巢</b>（釋放卵）、<b>輸卵管</b>（受精的地方）、<b>子宮</b>（胚胎發育的地方）、<b>陰道</b>。']],
terms:[['sperm','精子'],['ovum','卵'],['zygote','合子'],['testis','睾丸'],['sperm duct','輸精管'],['urethra','尿道'],['ovary','卵巢'],['oviduct','輸卵管'],['uterus','子宮'],['sex hormone','性激素']],
qs:[
M(1,'The male sex cell is the…','男性的性細胞是……',[['sperm','精子'],['ovum','卵'],['zygote','合子'],['embryo','胚胎']],'Sperms are made in the testes.','精子在睾丸中產生。'),
M(1,'Which organ produces ova?','哪個器官產生卵？',[['Ovary','卵巢'],['Uterus','子宮'],['Testis','睾丸'],['Vagina','陰道']],'Ovaries release ova.','卵巢釋放卵。'),
M(1,'How many chromosomes are in a human sperm?','人類精子有多少條染色體？',[['23','23'],['46','46'],['92','92'],['2','2']],'Sex cells have half the number: 23.','性細胞有一半數目：23 條。'),
T(2,'An ovum can move by itself.','卵能自行移動。',false,'The ovum is moved along the oviduct; sperms swim.','卵是被輸卵管推送的；精子會游動。'),
T(2,'A zygote with XY sex chromosomes develops into a male.','性染色體為 XY 的合子會發育成男性。',true,'XX = female, XY = male.','XX＝女性，XY＝男性。'),
M(2,'Where does a baby develop inside the mother?','嬰兒在母親體內哪裏發育？',[['Uterus','子宮'],['Ovary','卵巢'],['Oviduct','輸卵管'],['Stomach','胃']],'The uterus has a thick lining for the embryo.','子宮有厚厚的內膜讓胚胎發育。'),
M(2,'Which tube carries both urine and semen in males?','男性哪條管道同時輸送尿液和精液？',[['Urethra','尿道'],['Sperm duct','輸精管'],['Oviduct','輸卵管'],['Vagina','陰道']],'At different times, not together.','在不同時間輸送，不會同時。'),
M(3,'A sperm (23) fuses with an ovum (23). How many chromosomes does the zygote have?','精子（23 條）與卵（23 條）融合，合子有多少條染色體？',[['46','46'],['23','23'],['69','69'],['92','92']],'23 + 23 = 46, restoring the normal number.','23 + 23 = 46，回復正常數目。'),
M(3,'Which sex chromosome in the SPERM decides that a baby will be a boy?','精子中哪種性染色體決定嬰兒是男孩？',[['Y','Y'],['X','X'],['XX','XX'],['Any chromosome','任何染色體']],'Ovum always gives X; sperm gives X or Y.','卵總是提供 X；精子提供 X 或 Y。'),
M(4,'Why does a sperm have a tail while an ovum is large?','為甚麼精子有尾部，而卵則較大？',[['Sperm swims to the ovum; the ovum stores food for the early embryo','精子游向卵；卵儲存供早期胚胎使用的養分'],['Both just look different by chance','兩者只是碰巧不同'],['The ovum needs to swim','卵需要游動'],['Sperm stores food','精子儲存養分']],'Structure matches function.','結構配合功能。'),
M(5,'"The mother decides whether the baby is a boy or girl." Evaluate this claim.','「母親決定嬰兒是男孩還是女孩。」評價這說法。',[['Incorrect – the ovum always carries X; the sperm (X or Y) decides','不正確－卵總是帶 X；由精子（X 或 Y）決定'],['Correct – the ovum carries Y','正確－卵帶 Y'],['Correct – the uterus decides','正確－由子宮決定'],['Incorrect – the food eaten decides','不正確－由所吃的食物決定']],'Chance of boy or girl is about 50:50 each time.','每次生男或生女的機會約為各半。'),
M(6,'Create a flow chart of the path of a sperm. Which is correct?','為精子的路徑製作流程圖，哪個正確？',[['Testis → sperm duct → urethra → out through penis','睾丸 → 輸精管 → 尿道 → 經陰莖排出'],['Sperm duct → testis → urethra','輸精管 → 睾丸 → 尿道'],['Urethra → testis → sperm duct','尿道 → 睾丸 → 輸精管'],['Testis → oviduct → uterus','睾丸 → 輸卵管 → 子宮']],'Sex glands add fluid to form semen along the way.','途中性腺體加入液體形成精液。')
]},
{id:'4.4',en:'Sexual maturity and birth of a new life',zh:'性成熟和新生命的誕生',
notes:[['<b>Puberty</b>: testes start producing sperms (boys); ovaries start releasing ova (girls); <b>secondary sexual characteristics</b> appear.','<b>青春期</b>：男孩的睾丸開始產生精子；女孩的卵巢開始釋放卵；出現<b>第二性徵</b>。'],
['<b>Menstrual cycle</b> (~28 days): the <b>uterine lining</b> thickens and breaks down. <b>Menstruation</b>: lining + ovum pass out with some blood. <b>Ovulation</b>: release of an ovum.','<b>月經週期</b>（約 28 日）：<b>子宮內膜</b>增厚然後脫落。<b>月經</b>：內膜組織和卵連同少量血液排出。<b>排卵</b>：釋放卵。'],
['<b>Fertilization</b> (sperm + ovum → zygote, in oviduct) → <b>implantation</b> (embryo attaches to uterine lining) → growth → <b>birth</b>.','<b>受精</b>（精子＋卵 → 合子，在輸卵管）→ <b>植入</b>（胚胎附着於子宮內膜）→ 生長 → <b>分娩</b>。'],
['The <b>placenta</b> passes nutrients and oxygen from mother to embryo and wastes back; connected by the <b>umbilical cord</b>. <b>Amniotic fluid</b> in the <b>amnion</b> protects the foetus.','<b>胎盤</b>把養分和氧由母親傳給胚胎，並把廢物送回；以<b>臍帶</b>連接。<b>羊膜</b>內的<b>羊水</b>保護胎兒。']],
terms:[['puberty','青春期'],['menstrual cycle','月經週期'],['menstruation','月經'],['ovulation','排卵'],['uterine lining','子宮內膜'],['fertilization','受精'],['implantation','植入'],['embryo','胚胎'],['foetus','胎兒'],['placenta','胎盤'],['umbilical cord','臍帶'],['amniotic fluid','羊水']],
qs:[
M(1,'The fusion of a sperm and an ovum is called…','精子與卵的融合稱為……',[['fertilization','受精'],['implantation','植入'],['menstruation','月經'],['ovulation','排卵']],'It forms a zygote.','形成合子。'),
M(1,'About how long is a menstrual cycle?','月經週期大約多長？',[['28 days','28 日'],['7 days','7 日'],['1 year','1 年'],['9 months','9 個月']],'About 28 days, it may vary.','約 28 日，因人而異。'),
M(1,'The release of an ovum from the ovary is called…','卵巢釋放卵的過程稱為……',[['ovulation','排卵'],['fertilization','受精'],['implantation','植入'],['birth','分娩']],'Usually around the middle of the cycle.','通常在週期中段。'),
T(2,'Puberty happens in both boys and girls.','男孩和女孩都會經歷青春期。',true,'Secondary sexual characteristics appear in both.','兩者都會出現第二性徵。'),
T(2,'The embryo gets oxygen by breathing through its lungs in the uterus.','胚胎在子宮內用肺呼吸取得氧。',false,'Oxygen comes from the mother\'s blood through the placenta.','氧經胎盤從母親的血液取得。'),
M(2,'Which structure joins the foetus to the placenta?','哪個結構連接胎兒和胎盤？',[['Umbilical cord','臍帶'],['Oviduct','輸卵管'],['Amnion','羊膜'],['Urethra','尿道']],'It carries blood vessels.','臍帶內有血管。'),
M(2,'Where does fertilization usually take place?','受精通常在哪裏發生？',[['Oviduct','輸卵管'],['Uterus','子宮'],['Ovary','卵巢'],['Vagina','陰道']],'The zygote then moves to the uterus.','合子之後移到子宮。'),
M(3,'Put these in order: implantation, fertilization, birth, embryo growth.','排列次序：植入、受精、分娩、胚胎生長。',[['Fertilization → implantation → embryo growth → birth','受精 → 植入 → 胚胎生長 → 分娩'],['Implantation → fertilization → birth → growth','植入 → 受精 → 分娩 → 生長'],['Birth → fertilization → implantation → growth','分娩 → 受精 → 植入 → 生長'],['Growth → birth → fertilization → implantation','生長 → 分娩 → 受精 → 植入']],'A zygote must form before it can attach.','必須先形成合子才能植入。'),
M(3,'What is the function of amniotic fluid?','羊水有甚麼功能？',[['Protects the foetus from bumps','保護胎兒免受碰撞'],['Gives oxygen','提供氧'],['Makes sperms','產生精子'],['Digests food','消化食物']],'It acts as a shock absorber.','它有減震作用。'),
M(4,'Why should a pregnant woman NOT smoke or drink alcohol?','為甚麼懷孕婦女不應吸煙或飲酒？',[['Harmful substances can pass through the placenta to the foetus','有害物質可經胎盤進入胎兒體內'],['The placenta blocks all substances','胎盤會阻擋所有物質'],['It only affects the mother','只影響母親'],['It makes the baby grow faster','令嬰兒生長得更快']],'The placenta lets many small substances pass.','胎盤會讓很多細小物質通過。'),
M(4,'During menstruation, what is passed out of the body?','月經期間，甚麼會排出體外？',[['Tissues of the uterine lining, the ovum and some blood','子宮內膜組織、卵和少量血液'],['Only urine','只有尿液'],['The placenta','胎盤'],['Sperms','精子']],'The lining breaks down when no fertilization occurs.','沒有受精時，子宮內膜會脫落。'),
M(5,'A friend is worried because her period is irregular in her first year after puberty. What is the BEST advice?','朋友在青春期第一年月經不規律，感到擔心。最好的建議是甚麼？',[['It is common at first; talk to a parent, school nurse or doctor if worried','初期很常見；如擔心可與家長、學校護士或醫生傾談'],['Ignore all body changes forever','永遠不理會身體變化'],['Stop eating','停止進食'],['It means she is seriously ill','表示她患了重病']],'Cycles often take time to become regular.','月經週期通常需要時間才會變得規律。'),
M(6,'Design a poster on caring for a baby before birth. Which set of tips is BEST?','設計一張關於產前照顧嬰兒的海報，哪組建議最好？',[['Balanced diet, no smoking/alcohol, regular medical check-ups','均衡飲食、不吸煙飲酒、定期產前檢查'],['Eat only sweets and skip check-ups','只吃甜食並不做檢查'],['Smoke to relax','吸煙放鬆'],['Take any medicine without advice','隨便服藥']],'What the mother takes in reaches the foetus.','母親攝取的東西會到達胎兒。')
]},
{id:'4.5',en:'Becoming parents',zh:'成為父母',
notes:[['The most reliable sign of pregnancy is the <b>absence of menstruation</b>.','懷孕最可靠的徵兆是<b>月經停止</b>。'],
['<b>Parental care</b> is important for the survival, growth and development of babies.','<b>親代照顧</b>對嬰兒的存活、成長和發育十分重要。'],
['Married couples practise <b>family planning</b> to decide how many children to have and when.','已婚夫婦透過<b>家庭計劃</b>決定生育子女的數目和時間。'],
['Birth control: prevent ovum release – <b>contraceptive pills</b>; prevent fertilization – <b>condom</b>, <b>rhythm method</b>, <b>sterilization</b>; prevent embryo development – <b>IUD</b>.','避孕方法：防止排卵－<b>避孕丸</b>；防止受精－<b>安全套</b>、<b>安全期避孕法</b>、<b>絕育手術</b>；防止胚胎發育－<b>子宮環</b>。']],
terms:[['pregnancy','懷孕'],['parental care','親代照顧'],['family planning','家庭計劃'],['contraceptive pill','避孕丸'],['condom','安全套'],['rhythm method','安全期避孕法'],['sterilization','絕育手術'],['intrauterine device (IUD)','子宮環']],
qs:[
M(1,'What is the most reliable sign of pregnancy?','懷孕最可靠的徵兆是甚麼？',[['Absence of menstruation','月經停止'],['Feeling hungry','感到肚餓'],['Getting taller','長高'],['Having a cold','患感冒']],'Menstruation stops because the lining is kept for the embryo.','由於內膜被保留給胚胎，月經會停止。'),
M(1,'Contraceptive pills work by…','避孕丸的原理是……',[['preventing the release of ova','防止排卵'],['killing the embryo','殺死胚胎'],['blocking the urethra','阻塞尿道'],['preventing puberty','阻止青春期']],'No ovum → no fertilization.','沒有卵 → 不會受精。'),
T(1,'Parental care helps babies survive and develop.','親代照顧幫助嬰兒存活和成長。',true,'Babies depend on parents for food, warmth and protection.','嬰兒依賴父母提供食物、溫暖和保護。'),
T(2,'The rhythm method is the most reliable birth control method.','安全期避孕法是最可靠的避孕方法。',false,'Cycles vary, so the "safe period" is hard to predict – it is unreliable.','月經週期會改變，「安全期」難以預測，所以不太可靠。'),
M(2,'Which method prevents fertilization by stopping sperms reaching the ovum?','哪種方法透過阻止精子到達卵以防止受精？',[['Condom','安全套'],['Contraceptive pill','避孕丸'],['IUD','子宮環'],['Balanced diet','均衡飲食']],'A physical barrier.','一種物理屏障。'),
M(2,'An intrauterine device (IUD) works by…','子宮環的原理是……',[['preventing the development of an embryo in the uterus','防止胚胎在子宮內發育'],['stopping ovulation','阻止排卵'],['making sperms','產生精子'],['cutting sperm ducts','切斷輸精管']],'It prevents implantation.','它阻止胚胎植入。'),
M(3,'Male sterilization cuts and ties the…','男性絕育手術會切斷並紮起……',[['sperm ducts','輸精管'],['urethra','尿道'],['oviducts','輸卵管'],['testes','睾丸']],'Sperms cannot leave the testes.','精子不能離開睾丸。'),
M(3,'Which birth control method also helps reduce the spread of sexually transmitted infections?','哪種避孕方法同時有助減少性病傳播？',[['Condom','安全套'],['Contraceptive pill','避孕丸'],['Rhythm method','安全期避孕法'],['IUD','子宮環']],'It is a barrier to body fluids.','它能阻隔體液。'),
M(4,'Why is family planning important?','為甚麼家庭計劃很重要？',[['Parents can give each child enough care, time and resources','父母可為每個孩子提供足夠的照顧、時間和資源'],['It makes babies taller','令嬰兒長得較高'],['It stops puberty','阻止青春期'],['It is only about money','只與金錢有關']],'Planning supports child health and family well-being.','計劃有助孩子健康和家庭福祉。'),
M(4,'Sterilization is suitable for couples who…','絕育手術適合哪類夫婦？',[['do not want any more children','不想再生育的夫婦'],['want a baby next year','打算明年生育的夫婦'],['are teenagers','青少年'],['want twins','想要雙胞胎的夫婦']],'It is usually permanent.','它通常是永久性的。'),
M(5,'Which comparison of birth control methods is CORRECT?','以下哪個避孕方法的比較是正確的？',[['Pills stop ovulation; condoms block sperms; IUDs stop embryo development','避孕丸阻止排卵；安全套阻隔精子；子宮環阻止胚胎發育'],['All methods work the same way','所有方法原理相同'],['Condoms stop ovulation','安全套阻止排卵'],['IUDs are used by males','子宮環由男性使用']],'Match each method to its working principle.','把每種方法與其原理配對。'),
M(6,'A class creates a "Ready to be parents?" checklist. Which item is MOST relevant?','班上製作「準備好做父母嗎？」清單，哪一項最相關？',[['Can we give time, love, care and money for a child\'s growth?','我們能否為孩子的成長付出時間、愛心、照顧和金錢？'],['Do we have the newest phone?','我們有最新款手機嗎？'],['Is our flat painted pink?','我們的單位漆成粉紅色嗎？'],['Do we like cartoons?','我們喜歡卡通嗎？']],'Parental care needs commitment.','親代照顧需要承擔。')
]},
{id:'4.6',en:'Heredity and variation',zh:'遺傳和變異',
notes:[['<b>Heredity</b> is the transmission of genetic information (in DNA) from parents to offspring.','<b>遺傳</b>是把遺傳信息（在 DNA 中）由父母傳給子代。'],
['A <b>genetic tree diagram</b> shows how a trait passes through a family.','<b>遺傳系譜圖</b>顯示某特徵在家族中如何傳遞。'],
['Most <b>variations</b> are determined by both <b>heredity and the environment</b>.','大部分<b>變異</b>同時由<b>遺傳和環境</b>決定。'],
['<b>Discontinuous variation</b>: distinct categories (eye colour, blood group, earlobes) → <b>bar chart</b>. <b>Continuous variation</b>: range of values (height, weight) → <b>histogram</b>.','<b>不連續變異</b>：明確的類別（眼睛顏色、血型、耳垂）→ <b>棒形圖</b>。<b>連續變異</b>：一系列數值（身高、體重）→ <b>直方圖</b>。'],
['<b>Identical twins</b>: one zygote splits → same genes. <b>Non-identical twins</b>: two ova + two sperms → different genes.','<b>單卵雙生</b>：一個合子分開 → 基因相同。<b>二卵雙生</b>：兩個卵與兩個精子受精 → 基因不同。']],
terms:[['heredity','遺傳'],['variation','變異'],['continuous variation','連續變異'],['discontinuous variation','不連續變異'],['bar chart','棒形圖'],['histogram','直方圖'],['identical twins','單卵雙生'],['non-identical twins','二卵雙生']],
qs:[
M(1,'The passing of traits from parents to children is called…','特徵由父母傳給子女稱為……',[['heredity','遺傳'],['variation','變異'],['fertilization','受精'],['classification','分類']],'Genetic information is carried in DNA.','遺傳信息存於 DNA。'),
M(1,'Which is a DISCONTINUOUS variation?','以下哪一項是不連續變異？',[['Blood group','血型'],['Height','身高'],['Body weight','體重'],['Arm length','手臂長度']],'Blood group: A, B, AB or O – distinct categories.','血型：A、B、AB 或 O，屬明確類別。'),
M(1,'Which graph is used for CONTINUOUS variation?','連續變異用哪種圖表示？',[['Histogram','直方圖'],['Bar chart','棒形圖'],['Pie chart only','只可用圓形圖'],['Tree diagram','樹狀圖']],'Histogram bars touch because data are continuous.','直方圖的棒互相緊貼，因數據是連續的。'),
T(2,'Identical twins develop from a single zygote.','單卵雙生由一個合子發育而成。',true,'The embryo splits into two.','胚胎分開成兩個。'),
T(2,'Non-identical twins have exactly the same genetic make-up.','二卵雙生的遺傳組成完全相同。',false,'They come from two different ova and sperms.','他們來自兩個不同的卵和精子。'),
M(2,'Free or attached earlobes is an example of…','有垂耳或無垂耳是甚麼的例子？',[['discontinuous variation','不連續變異'],['continuous variation','連續變異'],['a habitat','生境'],['a stimulus','刺激']],'Two clear categories.','兩個清楚的類別。'),
M(3,'Your class records heights: 149.5–154.5 cm, 154.5–159.5 cm … Which graph should you draw?','全班記錄身高：149.5–154.5 cm、154.5–159.5 cm…… 你應畫哪種圖？',[['Histogram','直方圖'],['Bar chart with gaps','有空隙的棒形圖'],['Tree diagram','樹狀圖'],['Key','檢索表']],'Height is continuous – class intervals → histogram.','身高是連續變異，用組距畫直方圖。'),
M(3,'Identical twins raised apart have different body weights. This shows variation is also affected by…','分開撫養的單卵雙生體重不同，這顯示變異亦受甚麼影響？',[['the environment (e.g. diet, exercise)','環境（例如飲食、運動）'],['nothing at all','完全沒有'],['their blood group','他們的血型'],['their chromosomes only','只有他們的染色體']],'Same genes, different environment → different weight.','基因相同，環境不同 → 體重不同。'),
M(4,'Why are identical twins useful for studying the effect of the environment?','為甚麼單卵雙生有助研究環境的影響？',[['Their genes are the same, so differences are due to the environment','他們的基因相同，所以差異源自環境'],['They always live apart','他們總是分開生活'],['Their genes are completely different','他們的基因完全不同'],['They have no DNA','他們沒有 DNA']],'Genes are "controlled", like a fair test!','基因被「控制」了，就像公平測試！'),
M(4,'Boy-and-girl twins must be…','一男一女的雙胞胎一定是……',[['non-identical twins','二卵雙生'],['identical twins','單卵雙生'],['clones','複製品'],['from one sperm','來自同一精子']],'Identical twins have the same sex chromosomes.','單卵雙生的性染色體相同。'),
M(5,'"Height is determined only by genes." Evaluate this claim.','「身高只由基因決定。」評價這說法。',[['Partly wrong – genes set a range; diet, exercise and sleep also affect height','部分錯誤－基因設定範圍；飲食、運動和睡眠亦影響身高'],['Completely correct','完全正確'],['Height is determined only by food','身高只由食物決定'],['Height never varies','身高從不變異']],'Most variations = heredity + environment.','大部分變異＝遺傳＋環境。'),
M(6,'Plan a class survey on tongue rolling. Which plan is BEST?','策劃一個關於捲舌能力的全班調查，哪個計劃最好？',[['Ask each student to try, count "can / cannot", and draw a bar chart','請每位同學嘗試，統計「能／不能」並畫棒形圖'],['Measure tongue length and draw a histogram','量度舌頭長度並畫直方圖'],['Guess results without testing','不測試只猜結果'],['Only ask one student','只問一位同學']],'Tongue rolling is discontinuous → bar chart.','捲舌屬不連續變異 → 棒形圖。')
]}
]},
{id:5,en:'Energy',zh:'能量',col:'#FFE8D6',ink:'#C07A45',icon:'bolt',sections:[
{id:'5.1',en:'Energy changes',zh:'能量轉換',
notes:[['Forms of energy: <b>light</b>, <b>thermal</b>, <b>sound</b>, <b>chemical</b>, <b>kinetic</b> (moving), <b>potential</b> (raised position / stretched), <b>electrical</b>.','能量的形式：<b>光能</b>、<b>熱能</b>、<b>聲能</b>、<b>化學能</b>、<b>動能</b>（移動）、<b>勢能</b>（位於高處／被拉伸）、<b>電能</b>。'],
['Units: <b>joule (J)</b> and <b>kilocalorie (kcal)</b>. 1 kJ = 1000 J; 1 MJ = 1 000 000 J.','單位：<b>焦耳 (J)</b> 和<b>千卡 (kcal)</b>。1 kJ = 1000 J；1 MJ = 1 000 000 J。'],
['<b>Law of conservation of energy</b>: energy can be converted from one form to another, but cannot be created or destroyed.','<b>能量守恆定律</b>：能量可以由一種形式轉換成另一種形式，但不能被創造或消滅。'],
['A <b>Sankey diagram</b> shows an energy conversion; arrow widths are proportional to the amounts of energy.','<b>桑基圖</b>表示能量轉換；箭嘴的闊度與能量的多少成正比。'],
['Total energy input = useful energy output + energy wasted. <b>Efficiency = useful energy output ÷ total energy input × 100%</b>.','總輸入能量＝有用的輸出能量＋浪費的能量。<b>效率＝有用的輸出能量 ÷ 總輸入能量 × 100%</b>。']],
terms:[['energy','能量'],['light energy','光能'],['thermal energy','熱能'],['chemical energy','化學能'],['kinetic energy','動能'],['potential energy','勢能'],['electrical energy','電能'],['energy conversion','能量轉換'],['joule','焦耳'],['law of conservation of energy','能量守恆定律'],['Sankey diagram','桑基圖'],['efficiency','效率']],
qs:[
M(1,'What form of energy does a moving bus have?','行駛中的巴士具有甚麼形式的能量？',[['Kinetic energy','動能'],['Potential energy','勢能'],['Sound energy only','只有聲能'],['Chemical energy only','只有化學能']],'Moving objects have kinetic energy.','移動中的物體具有動能。'),
M(1,'Food, fuels and batteries store…','食物、燃料和電池儲存了……',[['chemical energy','化學能'],['kinetic energy','動能'],['light energy','光能'],['sound energy','聲能']],'Chemical energy is stored in substances.','化學能儲存在物質之中。'),
M(1,'What is the unit of energy?','能量的單位是甚麼？',[['joule (J)','焦耳 (J)'],['metre (m)','米 (m)'],['gram (g)','克 (g)'],['degree Celsius (°C)','攝氏度 (°C)']],'Energy is measured in joules; food labels often use kcal.','能量以焦耳量度；食物標籤常用千卡。'),
M(1,'An apple hanging high on a tree has…','高高掛在樹上的蘋果具有……',[['potential energy','勢能'],['sound energy','聲能'],['electrical energy','電能'],['light energy','光能']],'Objects at a raised position have potential energy.','位於高處的物體具有勢能。'),
T(2,'Energy can be created by a power station.','發電廠可以創造能量。',false,'Energy cannot be created or destroyed; the power station converts energy from one form to another.','能量不能被創造或消滅；發電廠只是把能量由一種形式轉換成另一種。'),
T(2,'In a Sankey diagram, a wider arrow represents more energy.','在桑基圖中，較闊的箭嘴代表較多能量。',true,'Arrow widths are proportional to the amounts of energy.','箭嘴闊度與能量多少成正比。'),
M(2,'How many joules are there in 1 kJ?','1 kJ 等於多少焦耳？',[['1000 J','1000 J'],['100 J','100 J'],['10 J','10 J'],['1 000 000 J','1 000 000 J']],'k = kilo = 1000.','k（千）＝1000。'),
M(3,'Which energy conversion happens in a torch powered by dry cells?','以乾電池推動的電筒中，發生了哪種能量轉換？',[['Chemical → electrical → light + thermal','化學能 → 電能 → 光能＋熱能'],['Electrical → chemical → light','電能 → 化學能 → 光能'],['Thermal → electrical → light','熱能 → 電能 → 光能'],['Kinetic → light only','動能 → 只有光能']],'Cells store chemical energy; the bulb gives light and some heat.','電池儲存化學能；燈泡發出光和一些熱。'),
M(3,'A girl goes down a slide. Which conversion mainly occurs?','女孩從滑梯滑下，主要發生了哪種能量轉換？',[['Potential energy → kinetic energy','勢能 → 動能'],['Kinetic energy → potential energy','動能 → 勢能'],['Chemical energy → light energy','化學能 → 光能'],['Sound energy → potential energy','聲能 → 勢能']],'She loses height and gains speed.','她的高度減少，速度增加。'),
M(3,'A light bulb uses 100 J of electrical energy and gives out 20 J of light energy. What is its efficiency?','一個燈泡消耗 100 J 電能，發出 20 J 光能。它的效率是多少？',[['20%','20%'],['80%','80%'],['120%','120%'],['5%','5%']],'Efficiency = 20 ÷ 100 × 100% = 20%.','效率＝20 ÷ 100 × 100%＝20%。'),
M(4,'A motor takes in 600 J and does 450 J of useful work. How much energy is wasted?','一個摩打輸入 600 J，有用的輸出為 450 J。浪費了多少能量？',[['150 J','150 J'],['450 J','450 J'],['1050 J','1050 J'],['0 J','0 J']],'Input = useful + wasted → wasted = 600 − 450 = 150 J.','輸入＝有用＋浪費 → 浪費＝600 − 450＝150 J。'),
M(5,'A filament bulb and an LED bulb give out the same brightness. The LED uses far less electrical energy. Which conclusion is BEST?','鎢絲燈泡和 LED 燈泡亮度相同，但 LED 用少很多電能。哪個結論最好？',[['The LED bulb is more efficient – less energy is wasted as heat','LED 燈泡效率較高，較少能量以熱的形式浪費'],['The filament bulb creates extra energy','鎢絲燈泡創造了額外的能量'],['Both have the same efficiency','兩者效率相同'],['The LED bulb destroys energy','LED 燈泡消滅了能量']],'Same useful output with less input = higher efficiency.','有用輸出相同而輸入較少＝效率較高。'),
M(6,'You design a toy car powered by a stretched rubber band. Which energy chain describes it?','你設計一輛以拉緊的橡筋推動的玩具車，哪條能量鏈可以描述它？',[['Potential energy (stretched band) → kinetic energy (+ some sound & thermal)','勢能（拉緊的橡筋）→ 動能（＋一些聲能和熱能）'],['Light → chemical','光能 → 化學能'],['Kinetic → electrical → potential only','動能 → 電能 → 只有勢能'],['Thermal → light','熱能 → 光能']],'A stretched object stores potential energy that becomes motion.','被拉伸的物體儲存勢能，並轉換成動能。')
]},
{id:'5.2',en:'Heat transfer',zh:'熱傳遞',
notes:[['Heat always flows from a <b>hotter</b> place to a <b>colder</b> place by <b>conduction</b>, <b>convection</b> or <b>radiation</b>.','熱總是由<b>較熱</b>的地方傳到<b>較冷</b>的地方，方式有<b>傳導</b>、<b>對流</b>和<b>輻射</b>。'],
['<b>Conduction</b>: through solids, liquids and gases; fast in <b>conductors</b> (metals), slow in <b>insulators</b> (wood, plastic, air).','<b>傳導</b>：可在固體、液體和氣體中發生；在<b>導體</b>（金屬）中快，在<b>絕緣體</b>（木、塑膠、空氣）中慢。'],
['<b>Convection</b>: hot liquid or gas rises and carries heat upwards; only in liquids and gases. Faster if the heat source is at the <b>bottom</b>.','<b>對流</b>：受熱的液體或氣體上升，把熱向上帶；只在液體和氣體中發生。熱源在<b>底部</b>時較快。'],
['<b>Radiation</b>: heat travels directly from the source, even through a <b>vacuum</b>. <b>Dull, dark</b> surfaces are better absorbers and emitters than <b>shiny, light</b> ones.','<b>輻射</b>：熱直接由熱源傳出，可穿過<b>真空</b>。<b>暗啞、深色</b>的表面比<b>光亮、淺色</b>的表面更能吸收和發射輻射。']],
terms:[['heat transfer','熱傳遞'],['conduction','傳導'],['convection','對流'],['radiation','輻射'],['conductor','導體'],['insulator','絕緣體'],['vacuum','真空'],['absorber of radiation','輻射吸收體'],['emitter of radiation','輻射發射體']],
qs:[
M(1,'How does heat from the Sun reach the Earth through space?','太陽的熱怎樣穿過太空到達地球？',[['Radiation','輻射'],['Conduction','傳導'],['Convection','對流'],['Evaporation','蒸發']],'Space is a vacuum; only radiation can travel through it.','太空是真空，只有輻射能穿過。'),
M(1,'Which is a good conductor of heat?','以下哪一項是熱的良導體？',[['Copper','銅'],['Wood','木'],['Plastic','塑膠'],['Air','空氣']],'Metals are good conductors.','金屬是良導體。'),
M(1,'Convection can take place in…','對流可以在哪裏發生？',[['liquids and gases only','只在液體和氣體中'],['solids only','只在固體中'],['a vacuum','真空中'],['all solids, liquids and gases equally','固體、液體和氣體都同樣可以']],'Particles in solids cannot move around to carry heat.','固體中的粒子不能四處移動來傳熱。'),
T(2,'Heat flows from a colder object to a hotter object.','熱由較冷的物體傳到較熱的物體。',false,'Heat flows from hotter to colder.','熱由較熱傳到較冷。'),
T(2,'A dull black surface is a better absorber of radiation than a shiny white surface.','暗啞黑色表面比光亮白色表面更能吸收輻射。',true,'Dark, dull surfaces absorb and emit radiation better.','深色暗啞的表面較能吸收和發射輻射。'),
M(2,'Why do pot handles often use plastic or wood?','為甚麼鍋柄常用塑膠或木製成？',[['They are insulators, so less heat reaches your hand','它們是絕緣體，較少熱傳到手上'],['They are good conductors','它們是良導體'],['They look nicer only','只是較好看'],['They make the food cook faster','令食物煮得較快']],'Insulators slow down conduction.','絕緣體減慢傳導。'),
M(3,'An air-conditioner is usually installed high on a wall because…','冷氣機通常安裝在牆的高處，因為……',[['cool air sinks, setting up convection currents in the room','冷空氣下沉，在房間內形成對流'],['hot air sinks','熱空氣下沉'],['it works by conduction through the wall','它靠穿過牆壁的傳導運作'],['radiation only travels downwards','輻射只會向下傳']],'Cold air is denser and sinks; warm air rises to be cooled.','冷空氣較重會下沉；暖空氣上升再被冷卻。'),
M(3,'Oven gloves protect your hands mainly by…','焗爐手套主要透過甚麼保護雙手？',[['reducing the thermal energy conducted from the pan to your hands','減少由鍋傳導到手的熱能'],['cooling down the food','令食物冷卻'],['making the pan hotter','令鍋更熱'],['reflecting sound','反射聲音']],'The gloves are insulators with trapped air.','手套是含有空氣的絕緣體。'),
M(3,'Where should the heater in a water tank be placed for fastest heating?','水箱的加熱器應放在哪裏，水才熱得最快？',[['At the bottom','底部'],['At the top','頂部'],['Outside the tank','水箱外面'],['It does not matter','沒有分別']],'Hot water rises from the bottom, so convection heats all the water.','熱水由底部上升，對流令全部水變熱。'),
M(4,'Why do people wear light-coloured clothes in summer?','為甚麼人們在夏天穿淺色衣服？',[['Light colours absorb less radiation from the Sun','淺色吸收較少太陽輻射'],['Light colours conduct heat into the body','淺色把熱傳導入身體'],['Light colours stop convection','淺色阻止對流'],['Light colours are heavier','淺色較重']],'Light, shiny surfaces are poor absorbers.','淺色光亮的表面吸收能力較差。'),
M(4,'A vacuum flask has a vacuum between two glass walls. Which heat transfers does the vacuum reduce?','真空瓶兩層玻璃之間是真空。真空減少了哪些熱傳遞？',[['Conduction and convection','傳導和對流'],['Radiation only','只有輻射'],['None of them','全部都不能減少'],['Radiation and convection only','只有輻射和對流']],'No particles in a vacuum → no conduction or convection. Silvered walls reduce radiation.','真空沒有粒子 → 不能傳導或對流。鍍銀的壁減少輻射。'),
M(5,'Two cans of water, one black and one silver, are left in the sun. Which prediction is BEST?','一黑一銀兩罐水放在陽光下，哪個預測最好？',[['The black can warms up faster','黑色罐較快變暖'],['The silver can warms up faster','銀色罐較快變暖'],['Both warm up at exactly the same rate','兩罐的升溫速度完全相同'],['Neither warms up','兩罐都不會變暖']],'Dark dull surfaces absorb radiation better.','深色暗啞表面較能吸收輻射。'),
M(6,'Design a lunch box to keep soup hot. Which features are BEST?','設計一個保暖湯的飯盒，哪組特徵最好？',[['Double walls with a vacuum/air gap, shiny inner surface, tight lid','雙層壁中間有真空或空氣層、光亮內壁、密封蓋'],['Thin metal walls, no lid','薄金屬壁、沒有蓋'],['Dull black outside, open top','外面暗啞黑色、頂部開口'],['A hole at the bottom for air','底部開一個孔讓空氣流通']],'Reduce conduction, convection and radiation together.','同時減少傳導、對流和輻射。')
]},
{id:'5.3',en:'Energy sources',zh:'能源',
notes:[['The world needs a huge and increasing amount of energy. Our major energy source is <b>fossil fuels</b> (coal, oil, natural gas).','世界需要大量而且不斷增加的能量。我們主要的能源是<b>化石燃料</b>（煤、石油、天然氣）。'],
['Fossil fuels are <b>non-renewable</b>: they cannot be replaced in a short time and will be used up one day.','化石燃料是<b>不可再生能源</b>：用完後不能在短時間內補充，總有一天會用盡。'],
['Burning fossil fuels gives <b>air pollutants</b>, causes <b>acid rain</b>, and enhances the greenhouse effect → <b>global warming</b>.','燃燒化石燃料會產生<b>空氣污染物</b>、造成<b>酸雨</b>，並加劇溫室效應 → <b>全球暖化</b>。'],
['Alternative energy sources: <b>solar</b>, <b>wind</b>, <b>biomass</b>, <b>hydroelectric</b> (all <b>renewable</b>) and <b>nuclear power</b> (not renewable).','其他能源：<b>太陽能</b>、<b>風力發電</b>、<b>生物質能</b>、<b>水力發電</b>（全部<b>可再生</b>），以及<b>核電</b>（不可再生）。'],
['Saving energy reduces the use of fossil fuels, e.g. switch off lights, set air-conditioners to 25.5 °C, use energy-efficient appliances.','節約能源可減少使用化石燃料，例如關燈、把冷氣設定在 25.5 °C、使用高能源效益電器。']],
terms:[['energy source','能源'],['fossil fuel','化石燃料'],['non-renewable energy source','不可再生能源'],['renewable energy source','可再生能源'],['air pollutant','空氣污染物'],['acid rain','酸雨'],['global warming','全球暖化'],['solar energy','太陽能'],['wind power','風力發電'],['biomass energy','生物質能'],['hydroelectric power','水力發電'],['nuclear power','核電']],
qs:[
M(1,'Which is a fossil fuel?','以下哪一項是化石燃料？',[['Coal','煤'],['Sunlight','陽光'],['Wind','風'],['Wood pellets','木粒']],'Coal, oil and natural gas are fossil fuels.','煤、石油和天然氣都是化石燃料。'),
M(1,'Making use of water flow to generate electricity is called…','利用水流發電稱為……',[['hydroelectric power','水力發電'],['wind power','風力發電'],['solar energy','太陽能'],['nuclear power','核電']],'Hydro = water.','水力發電利用水流。'),
M(1,'Which alternative energy source is NOT renewable?','以下哪種其他能源不是可再生的？',[['Nuclear power','核電'],['Solar energy','太陽能'],['Wind power','風力發電'],['Biomass energy','生物質能']],'Nuclear fuel (e.g. uranium) is limited.','核燃料（例如鈾）的供應有限。'),
T(2,'Fossil fuels can be replaced in a short period of time.','化石燃料可以在短時間內補充。',false,'They took millions of years to form – they are non-renewable.','它們需要數以百萬年形成，是不可再生能源。'),
T(2,'Burning fossil fuels can cause acid rain.','燃燒化石燃料可導致酸雨。',true,'Gases such as sulphur dioxide dissolve in rainwater.','二氧化硫等氣體溶於雨水中。'),
M(2,'Biomass energy makes use of…','生物質能利用……',[['plant or animal matter','植物或動物物質'],['moving air','流動的空氣'],['sunlight only','只有陽光'],['falling water','下落的水']],'E.g. burning wood pellets or food waste to make electricity or fuels.','例如燃燒木粒或廚餘來發電或製造燃料。'),
M(2,'Which problem is linked to the enhanced greenhouse effect?','哪個問題與溫室效應加劇有關？',[['Global warming','全球暖化'],['Tooth decay','蛀牙'],['Strike back','回擊'],['Water hardness','水的硬度']],'More carbon dioxide traps more heat.','更多二氧化碳困住更多熱。'),
M(3,'Which energy-saving habit is BEST at home?','以下哪個在家中節約能源的習慣最好？',[['Switch off lights and appliances when not in use','不用時關掉燈和電器'],['Set the air-conditioner to 18 °C','把冷氣調到 18 °C'],['Leave the fridge door open','讓雪櫃門打開'],['Keep the TV on standby all day','讓電視整天處於待機']],'Less electricity used = fewer fossil fuels burned.','用電越少＝燃燒的化石燃料越少。'),
M(3,'Solar panels on a rooftop convert…','屋頂上的太陽能板把甚麼轉換成甚麼？',[['light energy into electrical energy','光能轉換成電能'],['electrical energy into light','電能轉換成光能'],['wind into light','風轉換成光'],['chemical energy into sound','化學能轉換成聲能']],'Solar cells produce electricity from sunlight.','太陽能電池利用陽光發電。'),
M(4,'Why is it hard for Hong Kong to rely only on solar energy?','為甚麼香港難以只依賴太陽能？',[['Limited land/roof space and sunlight changes with weather and night','土地和屋頂空間有限，而且陽光受天氣和晚上影響'],['Hong Kong has no sunlight','香港完全沒有陽光'],['Solar panels create pollution when working','太陽能板運作時產生污染'],['Solar energy is non-renewable','太陽能是不可再生的']],'Renewable sources also have concerns like supply stability and space.','可再生能源亦有供應穩定性和空間等問題。'),
M(4,'Compare coal and wind for making electricity. Which is TRUE?','比較用煤和用風發電，哪項正確？',[['Wind produces no air pollutants when generating, but supply is less stable','風力發電時不產生空氣污染物，但供應較不穩定'],['Coal is renewable','煤是可再生的'],['Wind causes acid rain','風力發電導致酸雨'],['Coal never runs out','煤永遠不會用完']],'Each source has pros and cons.','每種能源都有優點和缺點。'),
M(5,'A town must choose a new power source. Which reason BEST supports wind turbines on a windy island?','一個小鎮要選擇新能源，哪個理由最支持在大風的島上建風力發電機？',[['Wind is renewable and there is strong, steady wind there','風是可再生的，而且那裏風力強而穩定'],['Wind turbines work without any wind','風力發電機沒有風也能運作'],['They burn fossil fuels efficiently','它們有效率地燃燒化石燃料'],['They make the island quieter than before','它們令島嶼比以前更寧靜']],'Match the energy source to local conditions.','按當地條件選擇能源。'),
M(6,'Plan a "Low-carbon week" for your class. Which plan is MOST effective?','為你的班策劃「低碳週」，哪個計劃最有效？',[['Track daily electricity-saving actions (lights off, AC at 25.5 °C, walk/bus) and compare results','每日記錄節能行動（關燈、冷氣 25.5 °C、步行／乘巴士）並比較成果'],['Print posters on new paper every day','每天用新紙印海報'],['Keep all projectors on to save time','保持所有投影機開着以節省時間'],['Buy more single-use plastic','購買更多即棄塑膠']],'Measure actions to see real savings.','量度行動以看到真正的節約。')
]}
]},
{id:6,en:'Matter as particles',zh:'物質的粒子觀',col:'#DDEFFB',ink:'#4F86AE',icon:'atom',sections:[
{id:'6.1',en:'Matter and particle theory',zh:'物質和粒子理論',
notes:[['<b>Matter</b> is anything that has <b>mass</b> and takes up <b>space</b>. Air is matter too!','<b>物質</b>是任何有<b>質量</b>和佔有<b>空間</b>的東西。空氣也是物質！'],
['<b>Particle theory</b>: all matter is made of tiny <b>particles</b>, which move <b>randomly</b> all the time, with <b>empty spaces</b> between them.','<b>粒子理論</b>：所有物質由微小的<b>粒子</b>組成，粒子不停地<b>隨機</b>運動，粒子之間有<b>空隙</b>。'],
['Different substances are made of different particles, which have different sizes and masses.','不同物質由不同粒子組成，這些粒子的大小和質量各有不同。'],
['Evidence: smoke particles move in a <b>zig-zag path</b> under a microscope; smells and colours spread out (diffusion).','證據：在顯微鏡下，煙粒以<b>之字形路徑</b>移動；氣味和顏色會擴散。'],
['Particles can be <b>atoms</b> (basic unit of matter) or <b>molecules</b> (usually two or more atoms joined).','粒子可以是<b>原子</b>（物質的基本單位）或<b>分子</b>（通常由兩個或以上原子組成）。']],
terms:[['matter','物質'],['mass','質量'],['particle','粒子'],['randomly','隨機地'],['zig-zag path','之字形路徑'],['particle theory','粒子理論'],['atom','原子'],['molecule','分子']],
qs:[
M(1,'What is matter?','甚麼是物質？',[['Anything that has mass and takes up space','任何有質量和佔有空間的東西'],['Only solids','只有固體'],['Only things we can see','只有我們看得見的東西'],['Light and sound','光和聲音']],'Solids, liquids and gases are all matter.','固體、液體和氣體都是物質。'),
M(1,'What is the basic unit of matter?','物質的基本單位是甚麼？',[['Atom','原子'],['Cell','細胞'],['Molecule of water only','只有水分子'],['Gene','基因']],'Atoms join to form molecules.','原子結合形成分子。'),
T(1,'Particles in matter are always moving.','物質中的粒子一直在運動。',true,'They move randomly all the time.','它們不停地隨機運動。'),
T(2,'Air is not matter because we cannot see it.','空氣不是物質，因為我們看不見它。',false,'Air has mass and takes up space, so it is matter.','空氣有質量和佔有空間，所以是物質。'),
M(2,'Jayden pumps air out of a closed container. Its mass decreases because…','Jayden 從密封容器中抽走空氣，容器質量減少，因為……',[['air has mass','空氣有質量'],['the container melted','容器熔化了'],['air has no mass','空氣沒有質量'],['the balance is broken','天秤壞了']],'Removing air removes mass.','抽走空氣即減少質量。'),
M(2,'Under a microscope, smoke particles move in a…','在顯微鏡下，煙粒以甚麼方式移動？',[['zig-zag path','之字形路徑'],['perfect circle','完美的圓形'],['straight line only','只沿直線'],['they do not move','它們不會移動']],'They are hit randomly by moving air particles.','它們被移動的空氣粒子隨機撞擊。'),
M(3,'You can smell perfume from across the room. This is evidence that particles…','你在房間另一邊也能嗅到香水味，這證明粒子……',[['move and spread out','會移動和擴散'],['are very large','十分巨大'],['do not move','不會移動'],['have no mass','沒有質量']],'Perfume particles mix with air particles and spread.','香水粒子與空氣粒子混合並擴散。'),
M(3,'A drop of ink spreads through still water without stirring. This shows…','一滴墨水在靜止的水中不經攪拌也會擴散，這顯示……',[['water and ink particles move randomly','水和墨水粒子會隨機運動'],['ink is heavier than water','墨水比水重'],['water has no particles','水沒有粒子'],['particles are the same in all substances','所有物質的粒子都相同']],'Random motion mixes the particles.','隨機運動令粒子混合。'),
M(4,'A water molecule (H₂O) contains…','一個水分子 (H₂O) 含有……',[['2 hydrogen atoms and 1 oxygen atom','2 個氫原子和 1 個氧原子'],['1 hydrogen atom and 2 oxygen atoms','1 個氫原子和 2 個氧原子'],['only oxygen atoms','只有氧原子'],['cells','細胞']],'H₂ = 2 hydrogen, O = 1 oxygen.','H₂＝2 個氫，O＝1 個氧。'),
M(4,'Why does a smell spread faster on a hot day?','為甚麼氣味在炎熱的日子擴散得較快？',[['Particles move faster at higher temperature','溫度較高時粒子移動得較快'],['Particles become bigger','粒子變大'],['Air disappears','空氣消失'],['Particles stop moving','粒子停止移動']],'Higher temperature → faster particle movement.','溫度較高 → 粒子移動較快。'),
M(5,'"Iron and aluminium are made of the same particles." Evaluate this.','「鐵和鋁由相同的粒子組成。」評價這說法。',[['Incorrect – different substances are made of different particles','不正確－不同物質由不同粒子組成'],['Correct – all metals are the same','正確－所有金屬都一樣'],['Correct – they are both solids','正確－它們都是固體'],['Incorrect – metals have no particles','不正確－金屬沒有粒子']],'Particle theory point: different substances, different particles.','粒子理論：不同物質由不同粒子組成。'),
M(6,'Design a quick demo to show particles move. Which is BEST?','設計一個快速示範來顯示粒子會移動，哪個最好？',[['Drop food colouring into still water and watch it spread over time','把食用色素滴入靜止的水中，觀察它隨時間擴散'],['Weigh a stone twice','把石頭秤兩次'],['Look at a ruler','看一把尺'],['Freeze an empty cup','冷凍一個空杯']],'A visible spreading colour shows random particle movement.','看得見的顏色擴散顯示粒子隨機運動。')
]},
{id:'6.2',en:'Particle model',zh:'粒子模型',
notes:[['<b>Solid</b>: particles closely packed in a <b>regular pattern</b>, small spaces, each <b>vibrates about a fixed position</b> → fixed shape and fixed volume.','<b>固體</b>：粒子以<b>規則排列</b>緊密地排在一起，空隙小，每粒子<b>在固定位置振動</b> → 有固定形狀和體積。'],
['<b>Liquid</b>: closely packed, no regular pattern, particles <b>move around easily</b> → no fixed shape, fixed volume.','<b>液體</b>：粒子緊密但沒有規則排列，粒子<b>容易四處移動</b> → 沒有固定形狀，但有固定體積。'],
['<b>Gas</b>: particles <b>far apart</b>, no pattern, <b>move freely in all directions</b> → no fixed shape, no fixed volume; easily compressed.','<b>氣體</b>：粒子<b>相距很遠</b>，沒有規則，<b>向四方八面自由移動</b> → 沒有固定形狀和體積；容易壓縮。']],
terms:[['solid state','固態'],['liquid state','液態'],['gas state','氣態'],['particle model','粒子模型'],['vibrate','振動'],['compress','壓縮']],
qs:[
M(1,'In a solid, particles…','在固體中，粒子……',[['vibrate about fixed positions','在固定位置振動'],['move freely in all directions','向四方八面自由移動'],['are far apart','相距很遠'],['do not move at all','完全不動']],'They are held in a regular pattern.','它們以規則形式排列。'),
M(1,'In which state are the spaces between particles LARGEST?','哪種物態的粒子間空隙最大？',[['Gas','氣體'],['Liquid','液體'],['Solid','固體'],['All the same','全部相同']],'Gas particles are far apart.','氣體粒子相距很遠。'),
M(1,'Which state has a fixed volume but no fixed shape?','哪種物態有固定體積但沒有固定形狀？',[['Liquid','液體'],['Solid','固體'],['Gas','氣體'],['None','沒有']],'Liquids take the shape of their container.','液體會隨容器改變形狀。'),
T(2,'Gases can be compressed easily.','氣體容易被壓縮。',true,'There are large spaces between gas particles.','氣體粒子之間有很大的空隙。'),
T(2,'Particles in a liquid are arranged in a regular pattern.','液體中的粒子以規則形式排列。',false,'Only solids have a regular pattern.','只有固體的粒子有規則排列。'),
M(2,'Why does a gas fill the whole container?','為甚麼氣體會充滿整個容器？',[['Its particles move freely in all directions','它的粒子向四方八面自由移動'],['Its particles are fixed','它的粒子是固定的'],['Its particles are closely packed','它的粒子緊密排列'],['Gases have no particles','氣體沒有粒子']],'Gas has no fixed volume.','氣體沒有固定體積。'),
M(3,'Why is it very hard to compress a block of ice?','為甚麼冰塊很難被壓縮？',[['Its particles are closely packed with very small spaces','它的粒子緊密排列，空隙很小'],['Its particles move freely','它的粒子自由移動'],['Ice has no particles','冰沒有粒子'],['Ice is a gas','冰是氣體']],'No room to push particles closer.','粒子沒有空間可再靠近。'),
M(3,'You pour juice from a tall glass into a wide bowl. What happens?','你把果汁由高杯倒進闊碗，會怎樣？',[['Its shape changes but its volume stays the same','形狀改變，但體積不變'],['Its volume increases','體積增加'],['Its volume decreases','體積減少'],['It becomes a solid','它變成固體']],'Liquids: fixed volume, no fixed shape.','液體：體積固定，形狀不固定。'),
M(4,'A syringe of air can be pushed in, but a syringe of water cannot. Why?','裝滿空氣的針筒可以被推入，但裝滿水的不行，為甚麼？',[['Gas particles are far apart; liquid particles are closely packed','氣體粒子相距遠；液體粒子緊密排列'],['Water particles are bigger than the syringe','水粒子比針筒還大'],['Air has no mass','空氣沒有質量'],['Water particles do not move','水粒子不會移動']],'Compressibility depends on spaces between particles.','可壓縮性取決於粒子間的空隙。'),
M(4,'When ice melts, what happens to its particles?','冰熔化時，它的粒子有甚麼變化？',[['They leave fixed positions and move around each other','離開固定位置並互相環繞移動'],['They disappear','消失'],['They become larger','變大'],['They stop vibrating','停止振動']],'Solid → liquid: particles gain energy and move around.','固體 → 液體：粒子獲得能量並四處移動。'),
M(5,'Which particle diagram BEST represents steam?','哪個粒子圖最能代表蒸汽？',[['A few particles far apart, randomly placed','少量粒子相距很遠，隨意分佈'],['Particles tightly packed in rows','粒子整齊緊密地排成行'],['Particles closely packed but jumbled','粒子緊密但雜亂'],['No particles at all','完全沒有粒子']],'Steam is a gas.','蒸汽是氣體。'),
M(6,'Create a class role-play of a SOLID. What should students do?','設計一個扮演固體的班級角色扮演，同學應怎樣做？',[['Stand close together in rows and wiggle on the spot','站成緊密的行列，在原地搖擺'],['Run anywhere around the room','在房間任意奔跑'],['Walk around each other loosely','鬆散地互相繞行'],['Leave the room','離開房間']],'Fixed positions + vibrating = solid.','固定位置＋振動＝固體。')
]},
{id:'6.3',en:'Dissolving (particle view)',zh:'溶解（粒子角度）',
notes:[['During dissolving, solvent particles surround and collide with solute particles; the solute particles <b>move apart</b> and become <b>evenly distributed</b> among the solvent particles.','溶解時，溶劑粒子包圍並撞擊溶質粒子；溶質粒子<b>分散開來</b>，<b>均勻地分佈</b>在溶劑粒子之間。'],
['Mass is <b>conserved</b>: mass of solute + mass of solvent = mass of solution.','質量<b>守恆</b>：溶質質量＋溶劑質量＝溶液質量。'],
['The volume of the solution may be <b>different</b> from (often less than) the sum of the volumes, because small particles fit into the spaces between bigger ones.','溶液的體積可能與兩者體積之和<b>不同</b>（常常較少），因為細小粒子可以填入較大粒子之間的空隙。'],
['A <b>concentrated</b> solution has more solute in the same amount of solvent than a <b>dilute</b> one.','在相同份量的溶劑中，<b>濃</b>溶液比<b>稀</b>溶液含較多溶質。']],
terms:[['conserve','守恆'],['solute particle','溶質粒子'],['solvent particle','溶劑粒子'],['concentration','濃度'],['concentrated','濃的'],['dilute','稀的']],
qs:[
M(1,'When sugar dissolves, the sugar particles…','糖溶解時，糖粒子……',[['move apart and spread evenly among water particles','分散開來，均勻分佈在水粒子之間'],['disappear','消失'],['become bigger','變大'],['turn into water particles','變成水粒子']],'The particles still exist – just spread out.','粒子仍然存在，只是分散了。'),
M(1,'20 g salt dissolves in 100 g water. What is the mass of the solution?','20 g 鹽溶於 100 g 水，溶液的質量是多少？',[['120 g','120 g'],['100 g','100 g'],['80 g','80 g'],['20 g','20 g']],'Mass is conserved: 20 + 100 = 120 g.','質量守恆：20 + 100 = 120 g。'),
T(2,'Mass is lost when a solute dissolves.','溶質溶解時質量會減少。',false,'Mass is conserved in dissolving.','溶解時質量守恆。'),
T(2,'Mixing 50 cm³ water with 50 cm³ alcohol can give less than 100 cm³ of liquid.','把 50 cm³ 水和 50 cm³ 酒精混合，所得液體可以少於 100 cm³。',true,'Smaller particles fill the spaces between larger ones.','較細的粒子填入較大粒子之間的空隙。'),
M(2,'A solution with a lot of solute in a small amount of water is…','在少量水中含大量溶質的溶液是……',[['concentrated','濃的'],['dilute','稀的'],['insoluble','不可溶的'],['pure water','純水']],'Concentration = amount of solute in a given amount of solvent.','濃度＝一定份量溶劑中溶質的份量。'),
M(3,'Why can we taste sugar in every part of a stirred cup of tea?','為甚麼在攪拌過的一杯茶中每一處都嚐到甜味？',[['Sugar particles are evenly distributed among water particles','糖粒子均勻地分佈在水粒子之間'],['Sugar floats on top','糖浮在頂部'],['Sugar sinks to the bottom','糖沉到底部'],['Sugar particles disappear','糖粒子消失']],'A solution is evenly mixed.','溶液是均勻混合的。'),
M(3,'Adding more water to a cup of juice makes it…','在一杯果汁中加入更多水，會令它……',[['more dilute','更稀'],['more concentrated','更濃'],['heavier in solute','溶質更多'],['a solid','變成固體']],'Same solute, more solvent → more dilute.','溶質相同，溶劑更多 → 更稀。'),
M(4,'Why does the total volume sometimes decrease when two liquids mix?','為甚麼兩種液體混合後總體積有時會減少？',[['Particles of one liquid fit into spaces between particles of the other','一種液體的粒子填入另一種液體粒子之間的空隙'],['Some particles are destroyed','部分粒子被消滅'],['Mass decreases','質量減少'],['The liquids evaporate instantly','液體立即蒸發']],'There are spaces between particles.','粒子之間有空隙。'),
M(4,'Before dissolving: beaker + water + sugar = 250 g on a balance. After dissolving, the balance reads…','溶解前：燒杯＋水＋糖在天秤上共 250 g。溶解後，天秤讀數是……',[['250 g','250 g'],['less than 250 g','少於 250 g'],['more than 250 g','多於 250 g'],['0 g','0 g']],'No particles leave, so mass stays the same.','沒有粒子離開，質量不變。'),
M(5,'Amy says "The salt vanished, so it is gone." Which is the BEST reply?','Amy 說「鹽消失了，所以沒有了。」哪個回應最好？',[['The salt particles are still there, spread among water particles – evaporate the water to get salt back','鹽粒子仍在，只是分散在水粒子之間——把水蒸發便可取回鹽'],['She is right – it is destroyed','她說得對——鹽被消滅了'],['The salt became water','鹽變成了水'],['The salt went into the air','鹽飄到空氣中']],'Dissolving is not disappearing.','溶解不是消失。'),
M(6,'Plan an experiment to show mass is conserved in dissolving. Which plan is BEST?','策劃一個實驗證明溶解時質量守恆，哪個計劃最好？',[['Weigh water and solute together in a sealed flask before and after dissolving','把水和溶質放在密封燒瓶中，在溶解前後量度總質量'],['Weigh only the water after dissolving','只在溶解後秤水'],['Measure the colour of the solution','量度溶液的顏色'],['Heat the solution until dry first','先把溶液加熱至乾']],'Compare total mass before and after, nothing added or lost.','比較前後的總質量，不加入也不流失任何物質。')
]},
{id:'6.4',en:'Thermal expansion and contraction',zh:'熱脹冷縮',
notes:[['Most substances <b>expand</b> when heated and <b>contract</b> when cooled – <b>thermal expansion and contraction</b>.','大部分物質受熱時<b>膨脹</b>，冷卻時<b>收縮</b>——這稱為<b>熱脹冷縮</b>。'],
['Heating → particles move <b>faster</b> → spaces between particles <b>increase</b> → the substance expands. (Particles themselves do NOT get bigger.)','加熱 → 粒子移動得<b>較快</b> → 粒子間的空隙<b>增加</b> → 物質膨脹。（粒子本身並<b>不會</b>變大。）'],
['Cooling → particles move slower → spaces decrease → the substance contracts.','冷卻 → 粒子移動較慢 → 空隙減少 → 物質收縮。'],
['Applications: gaps in railway tracks and bridges, liquid-in-glass thermometers, <b>bimetallic strips</b> in <b>thermostats</b>, loosening a tight metal lid with hot water.','應用：鐵路路軌和橋樑的空隙、液體玻璃溫度計、<b>恆溫器</b>中的<b>雙層金屬片</b>、用熱水令緊閉的金屬蓋鬆開。']],
terms:[['thermal expansion and contraction','熱脹冷縮'],['expand','膨脹'],['contract','收縮'],['thermostat','恆溫器'],['bimetallic strip','雙層金屬片']],
qs:[
M(1,'Most substances ___ when heated.','大部分物質受熱時會……',[['expand','膨脹'],['contract','收縮'],['disappear','消失'],['lose mass','失去質量']],'Thermal expansion.','熱脹。'),
M(1,'Which device uses a bimetallic strip to control temperature?','哪種裝置利用雙層金屬片控制溫度？',[['Thermostat','恆溫器'],['Measuring cylinder','量筒'],['Microscope','顯微鏡'],['Filter funnel','漏斗']],'The strip bends when heated and switches the circuit.','金屬片受熱彎曲，開關電路。'),
T(2,'When a metal expands, its particles become bigger.','金屬膨脹時，它的粒子會變大。',false,'The particles move faster and the SPACES between them increase.','粒子移動較快，粒子之間的空隙增加。'),
T(2,'Gaps are left between sections of railway tracks to allow for expansion on hot days.','鐵路路軌之間留有空隙，讓它們在炎熱天氣時膨脹。',true,'Without gaps, tracks could bend.','如沒有空隙，路軌可能彎曲。'),
M(2,'When a substance is cooled, its particles…','物質冷卻時，它的粒子……',[['move slower and get closer together','移動較慢並互相靠近'],['move faster','移動較快'],['get smaller','變小'],['disappear','消失']],'Cooling reduces the spaces between particles.','冷卻令粒子間的空隙減少。'),
M(3,'A tight metal lid on a glass jar can be loosened by…','玻璃瓶上緊閉的金屬蓋可以怎樣鬆開？',[['running hot water over the lid','用熱水沖金屬蓋'],['putting the jar in the freezer','把瓶放入冰格'],['shaking the jar','搖動瓶子'],['adding salt','加鹽']],'The metal lid expands more than the glass.','金屬蓋比玻璃膨脹得多。'),
M(3,'Boiled eggs are put in iced water so the shell peels easily. Why?','把熟雞蛋放入冰水，蛋殼便容易剝，為甚麼？',[['The egg contracts and pulls away from the shell','雞蛋收縮並與蛋殼分離'],['The egg expands and breaks the shell','雞蛋膨脹並撐破蛋殼'],['Iced water softens the shell','冰水令蛋殼變軟'],['Iced water dissolves the shell','冰水溶解蛋殼']],'Cooling → contraction.','冷卻 → 收縮。'),
M(3,'Why does the liquid in a thermometer rise when it gets warmer?','為甚麼溫度計內的液體在變暖時會上升？',[['The liquid expands when heated','液體受熱膨脹'],['The glass contracts','玻璃收縮'],['More liquid is created','產生更多液體'],['The liquid evaporates','液體蒸發']],'Liquid expansion pushes it up the narrow tube.','液體膨脹，沿幼管上升。'),
M(4,'Overhead power cables are hung loosely in summer. What would happen if they were tight?','架空電纜在夏天安裝時是鬆垂的。如果裝得很緊會怎樣？',[['They might snap when they contract in cold weather','天冷收縮時可能會斷裂'],['They would expand into the sky','會膨脹到天空'],['Nothing at all','甚麼也不會發生'],['They would melt','會熔化']],'Cooling makes them shorter and tighter.','冷卻令電纜變短變緊。'),
M(4,'A bimetallic strip of brass and iron bends when heated because…','由黃銅和鐵組成的雙層金屬片受熱會彎曲，因為……',[['the two metals expand by different amounts','兩種金屬膨脹的程度不同'],['both metals contract','兩種金屬都收縮'],['the metals melt','金屬熔化'],['iron has no particles','鐵沒有粒子']],'The metal that expands more ends up on the outside of the curve.','膨脹較多的金屬會在彎曲的外側。'),
M(5,'Which explanation of expansion is the MOST scientific?','哪個有關膨脹的解釋最科學？',[['Particles move faster and the spaces between them increase','粒子移動較快，粒子之間的空隙增加'],['Particles grow bigger','粒子變大'],['More particles are made','產生更多粒子'],['Heat is a substance that fills the object','熱是一種充滿物體的物質']],'Particle size and number do not change.','粒子的大小和數目不變。'),
M(6,'Design a bridge joint for a hot and cold climate. What should it include?','為冷熱變化大的地方設計橋樑接縫，應包括甚麼？',[['An expansion gap (e.g. sliding teeth joint) so the deck can expand and contract','伸縮縫（例如滑動齒狀接縫），讓橋面可以膨脹和收縮'],['Welding everything tightly with no gaps','把所有部分緊緊焊接，不留空隙'],['Using only ice blocks','只用冰塊建造'],['Painting it black to stop expansion','塗成黑色以阻止膨脹']],'Allow room for expansion and contraction.','預留膨脹和收縮的空間。')
]},
{id:'6.5',en:'Gas pressure',zh:'氣壓',
notes:[['Gas particles <b>bombard</b> (hit) surfaces; this exerts <b>gas pressure</b>.','氣體粒子<b>撞擊</b>表面，產生<b>氣壓</b>。'],
['<b>Smaller volume</b> (compressing a closed container) → particles hit the walls more often → <b>higher pressure</b>.','<b>體積減少</b>（壓縮密封容器）→ 粒子更頻密地撞擊容器壁 → <b>氣壓上升</b>。'],
['<b>Higher temperature</b> → particles move faster and hit the walls more often → <b>higher pressure</b>.','<b>溫度上升</b> → 粒子移動得較快，更頻密地撞擊容器壁 → <b>氣壓上升</b>。'],
['<b>Atmospheric pressure</b> is the pressure exerted by air particles in the atmosphere. It helps suction cups stick and lets us drink through a straw.','<b>大氣壓強</b>是大氣中空氣粒子產生的壓強。它令吸盤黏住，也令我們可用飲管吸飲品。']],
terms:[['gas pressure','氣壓'],['atmospheric pressure','大氣壓強'],['bombard','撞擊'],['compress','壓縮'],['suction cup','吸盤']],
qs:[
M(1,'Gas pressure is caused by…','氣壓是由甚麼造成的？',[['gas particles bombarding a surface','氣體粒子撞擊表面'],['gas particles standing still','氣體粒子靜止不動'],['light shining on gas','光照射氣體'],['particles getting bigger','粒子變大']],'Many tiny hits add up to a push.','無數次微小撞擊加起來形成推力。'),
M(1,'The pressure exerted by the air around the Earth is called…','地球周圍空氣產生的壓強稱為……',[['atmospheric pressure','大氣壓強'],['water pressure','水壓'],['blood pressure','血壓'],['density','密度']],'Air particles in the atmosphere bombard everything.','大氣中的空氣粒子撞擊所有物體。'),
T(2,'Decreasing the volume of a closed container of gas increases its pressure.','減少密封容器內氣體的體積會令氣壓增加。',true,'Particles hit the walls more often.','粒子更頻密地撞擊容器壁。'),
T(2,'Cooling a sealed can of gas increases the gas pressure.','冷卻密封的氣體罐會令氣壓增加。',false,'Cooling slows the particles → fewer, weaker hits → lower pressure.','冷卻令粒子變慢 → 撞擊減少 → 氣壓下降。'),
M(2,'Which change INCREASES the gas pressure in a closed container?','以下哪個改變會令密封容器內的氣壓增加？',[['Decrease the volume of the container','減少容器的體積'],['Decrease the temperature','降低溫度'],['Remove some gas particles','移走部分氣體粒子'],['Make the container bigger','令容器變大']],'Less space → more frequent collisions.','空間較少 → 撞擊更頻密。'),
M(3,'Why should aerosol cans NOT be heated?','為甚麼噴霧罐不可以加熱？',[['Gas pressure rises and the can may explode','氣壓上升，罐可能爆炸'],['The can will shrink','罐會縮小'],['The gas will turn into a solid','氣體會變成固體'],['Pressure will drop to zero','氣壓會降至零']],'Higher temperature → higher gas pressure.','溫度較高 → 氣壓較高。'),
M(3,'You push the plunger of a sealed syringe of air. It becomes harder to push because…','你推動密封且裝有空氣的針筒活塞，越推越難，因為……',[['the gas pressure inside increases','內裏的氣壓增加'],['air particles disappear','空氣粒子消失'],['the air turns into water','空氣變成水'],['the syringe expands','針筒膨脹']],'Smaller volume → higher pressure pushing back.','體積較小 → 氣壓較大，向外推回。'),
M(3,'How can you drink juice through a straw?','你怎樣可以用飲管喝果汁？',[['Sucking lowers the pressure in the straw; atmospheric pressure pushes the juice up','吸啜令飲管內氣壓降低；大氣壓強把果汁推上來'],['The straw pulls the juice by magnetism','飲管用磁力拉起果汁'],['Juice floats up by itself','果汁自己浮上來'],['The straw heats the juice','飲管加熱果汁']],'Atmospheric pressure does the pushing.','是大氣壓強把果汁推上來。'),
M(4,'A car tyre\'s pressure is higher after a long drive on a hot day. Why?','在炎熱天氣長途駕駛後，汽車輪胎的氣壓較高，為甚麼？',[['The air inside gets hotter so particles move faster and hit harder and more often','輪胎內空氣變熱，粒子移動較快，撞擊更頻密更有力'],['More air enters the tyre by itself','更多空氣自行進入輪胎'],['The tyre becomes smaller','輪胎變細'],['Air particles become bigger','空氣粒子變大']],'Temperature ↑ → pressure ↑.','溫度↑ → 氣壓↑。'),
M(4,'A suction cup sticks to a window because…','吸盤能黏在窗上，因為……',[['air pressure inside the cup is lower than atmospheric pressure outside','吸盤內的氣壓低於外面的大氣壓強'],['it is sticky glue','它有黏膠'],['glass attracts plastic','玻璃會吸引塑膠'],['there is more air inside the cup','吸盤內有更多空氣']],'Pushing out air lowers inside pressure; outside air pushes it on.','擠出空氣令內部氣壓降低，外面的空氣把它壓住。'),
M(5,'A sealed bag of crisps puffs up on a mountain top. Which explanation is BEST?','一包密封的薯片在山頂上脹起來，哪個解釋最好？',[['Atmospheric pressure outside is lower, so the gas inside pushes the bag outwards','外面的大氣壓強較低，袋內氣體把袋向外推'],['More crisps were made','薯片變多了'],['The bag cooled and contracted','袋冷卻收縮'],['Gas particles got bigger','氣體粒子變大']],'Inside pressure > outside pressure → bag expands.','內部氣壓 > 外部氣壓 → 袋膨脹。'),
M(6,'Design a demo showing atmospheric pressure is strong. Which is BEST?','設計一個示範說明大氣壓強很大，哪個最好？',[['Heat a little water in a can, seal and cool it – the can is crushed','在罐中加熱少量水，封口再冷卻——罐被壓扁'],['Blow up a balloon and let go','吹脹氣球再放手'],['Weigh an empty cup','秤一個空杯'],['Shine a torch at the wall','用電筒照牆']],'Cooling lowers inside pressure; atmospheric pressure crushes the can.','冷卻令內部氣壓下降，大氣壓強把罐壓扁。')
]},
{id:'6.6',en:'Density',zh:'密度',
notes:[['<b>Density</b> is the <b>mass per unit volume</b> of a substance. <b>Density = mass ÷ volume</b> (units: <b>g/cm³</b> or <b>kg/m³</b>).','<b>密度</b>是物質<b>每單位體積的質量</b>。<b>密度＝質量 ÷ 體積</b>（單位：<b>g/cm³</b> 或 <b>kg/m³</b>）。'],
['Objects of the same volume can have different masses – they have different densities.','相同體積的物體可以有不同質量——它們的密度不同。'],
['An object <b>denser</b> than its surroundings <b>sinks</b>; <b>less dense</b> → <b>floats</b>. (Water ≈ 1 g/cm³.)','物體比周圍物質<b>密度大</b>便會<b>下沉</b>；<b>密度小</b>便會<b>浮起</b>。（水約 1 g/cm³。）'],
['Density changes with temperature: heating → particles further apart → volume ↑ → density ↓ (hot air rises).','密度隨溫度改變：加熱 → 粒子距離增加 → 體積↑ → 密度↓（熱空氣上升）。']],
terms:[['density','密度'],['mass','質量'],['volume','體積'],['sink','下沉'],['float','浮起'],['medium','介質']],
qs:[
M(1,'Density is…','密度是……',[['mass per unit volume','每單位體積的質量'],['volume per unit mass','每單位質量的體積'],['mass × volume','質量 × 體積'],['weight only','只是重量']],'Density = mass ÷ volume.','密度＝質量 ÷ 體積。'),
M(1,'A common unit of density is…','密度的常用單位是……',[['g/cm³','g/cm³'],['cm³','cm³'],['g','g'],['°C','°C']],'Mass unit ÷ volume unit.','質量單位 ÷ 體積單位。'),
T(2,'An object less dense than water floats on water.','密度比水小的物體會浮在水面。',true,'Less dense than the surrounding medium → floats.','比周圍介質密度小 → 浮起。'),
T(2,'A bigger object always has a greater density.','較大的物體密度總是較大。',false,'Density depends on mass AND volume, not size alone. A big log floats; a small coin sinks.','密度取決於質量和體積，而不只是大小。大木頭會浮，小硬幣會沉。'),

function ipaOf(t){var ws=t.replace(/[()]/g,'').toLowerCase().split(/\s+/),o=[];for(var i=0;i<ws.length;i++){var v=IPA[ws[i]];if(!v)return '';o.push(v);}return '/'+o.join(' ')+'/';}

 var pref=['Google UK English Female','Google UK English Male','Serena','Kate','Daniel','Martha','Arthur','Sonia','Libby','Ryan','Hazel','George','Susan'];ukVoice=null;
 for(var i=0;i<pref.length&&!ukVoice;i++)for(var j=0;j<gb.length;j++)if(gb[j].name.indexOf(pref[i])>=0){ukVoice=gb[j];break;}
 if(!ukVoice)ukVoice=gb[0]||null;}
