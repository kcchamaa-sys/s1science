<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFDF6">
<title>Mochi Science Pals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: one cozy phone-width column (room scene on top, cards below); widens to a 2-column desk on tablets/desktop. Bottom tab bar. */
:root{
  --cream:#FFFDF6; --matcha:#D8E2DC; --pink:#FFE5EC; --rose:#E8AEB7; --butter:#FFF1C5; --sky:#D8F3DC;
  --lav:#EDE4F7; --ink:#5B4B49; --ink2:#8A7773; --line:#EADFD6; --card:#FFFFFF; --good:#6FB58A; --bad:#E2828F; --gold:#F2C14E;
  --shadow:0 6px 18px rgba(120,90,80,.12), 0 2px 4px rgba(120,90,80,.08);
  --r:22px; --font:'M PLUS Rounded 1c','Noto Sans TC',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9CC8E8;outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.app{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,253,246,.92);backdrop-filter:blur(8px);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px;margin-right:auto;min-width:0}
.brand small{font-weight:700;color:var(--ink2);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;min-height:36px}
.iconbtn{min-width:44px;min-height:44px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;transition:transform .15s}
.iconbtn:active,.btn:active,.tap:active{transform:scale(.94)}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:620px}
.nav button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink2);position:relative}
.nav button .ni{font-size:22px;line-height:1;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ni{transform:translateY(-3px) scale(1.15)}
.nav button[aria-current="page"]::after{content:"";position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--rose)}
.badge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;min-width:16px;line-height:16px}
/* cards & buttons */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:2px solid #fff}
.btn{min-height:48px;padding:10px 18px;border-radius:18px;font-weight:800;background:var(--butter);border:2px solid #EBD89A;box-shadow:0 3px 0 #EBD89A;transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn.pink{background:var(--pink);border-color:var(--rose);box-shadow:0 3px 0 var(--rose)}
.btn.green{background:var(--sky);border-color:#A9D3B3;box-shadow:0 3px 0 #A9D3B3}
.btn.lav{background:var(--lav);border-color:#CDBDE5;box-shadow:0 3px 0 #CDBDE5}
.btn.white{background:#fff;border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{min-height:44px;padding:6px 12px;font-size:14px;border-radius:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.muted{color:var(--ink2)}
.h-sec{font-size:20px;font-weight:800;margin-block:18px 10px;display:flex;align-items:center;gap:8px}
/* home */
.home{display:grid;gap:16px;margin-top:14px}
@media (min-width:880px){.home{grid-template-columns:1.15fr 1fr;align-items:start}}
.room{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/3.3;max-width:100%;box-shadow:var(--shadow);border:3px solid #fff}
.room .wall{position:absolute;inset:0 0 24% 0}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#EFD9C3,#E6CBB0);border-top:3px solid #D9BA9C}
.room .floor::before{content:"";position:absolute;left:18%;right:18%;top:22%;height:44%;border-radius:50%;background:var(--pink);opacity:.8}
.room .window{position:absolute;top:8%;right:6%;width:26%;aspect-ratio:1/1.05}
.room .prop{position:absolute;left:4%;bottom:14%;width:25%}
.room .stk{position:absolute;width:12%;aspect-ratio:1}
.room .petwrap{position:absolute;left:50%;bottom:4%;width:52%;transform:translateX(-50%)}
.room .bubble{position:absolute;left:50%;top:5%;transform:translateX(-50%);max-width:70%;background:#fff;border-radius:18px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);text-align:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.room .bubble::after{content:"";position:absolute;left:50%;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
.pet{display:block;width:100%;height:auto;overflow:visible;cursor:pointer}
.pet .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:100px 176px}
.pet.boing .bob{animation:boing .6s cubic-bezier(.3,1.6,.5,1)}
.pet .zzz{animation:zz 2s ease-in-out infinite}
.pet .spark{animation:tw 1.4s ease-in-out infinite}
.pet .tear{animation:drip 1.6s ease-in infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.02,.98)}}
@keyframes boing{0%{transform:scale(1,1)}30%{transform:scale(1.15,.85)}60%{transform:scale(.92,1.1)}100%{transform:scale(1,1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-10px)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes popin{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stats{display:grid;gap:10px}
.stat{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;font-weight:700;font-size:14px}
.bar{height:14px;border-radius:999px;background:#F3ECE6;overflow:hidden;border:2px solid #fff;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.petname{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.petname h2{font-size:22px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--lav)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions .btn{flex-direction:column;gap:2px;min-height:72px;font-size:13px;padding:8px}
.actions .btn .e{font-size:24px;line-height:1}
.streak{display:flex;align-items:center;gap:12px}
.flame{font-size:34px;line-height:1}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days span{width:30px;height:30px;border-radius:50%;background:#F3ECE6;display:grid;place-items:center;font-size:12px;font-weight:800}
.days span.on{background:var(--butter);box-shadow:inset 0 0 0 2px var(--gold)}
/* study */
.chap{border-radius:26px;padding:16px;box-shadow:var(--shadow);border:3px solid #fff}
.chap-h{display:flex;align-items:center;gap:12px}
.chap-h .ic{width:52px;height:52px;border-radius:18px;background:#fff;display:grid;place-items:center;flex:none}
.chap-h h3{font-size:18px}
.sec{background:#fff;border-radius:18px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}
.sec b{display:block;font-size:15px}
.sec .meta{font-size:12px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{letter-spacing:1px;color:var(--gold);font-size:15px}
.stars .off{color:#E6DCD2}
.sec .acts{display:flex;gap:6px}
.prog{height:6px;border-radius:9px;background:#F3ECE6;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--good)}
/* overlay / modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(91,75,73,.35);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
@media (min-width:700px){.ov{align-items:center;padding:24px}}
.sheet{background:var(--cream);width:100%;max-width:680px;max-height:100%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.3,1.3,.5,1);position:relative}
@media (min-width:700px){.sheet{border-radius:28px;max-height:92vh}}
@keyframes up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h2{font-size:19px;margin-right:auto;min-width:0}
.x{min-width:44px;min-height:44px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:18px;font-weight:800}
/* quiz */
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots span{width:14px;height:14px;border-radius:50%;background:#EDE3DA}
.dots span.ok{background:var(--good)}.dots span.no{background:var(--bad)}.dots span.cur{background:var(--rose);transform:scale(1.2)}
.bloom{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--matcha)}
.qcard{margin-top:12px}
.qtext{font-size:18px;font-weight:700;line-height:1.55}
.opts{display:grid;gap:10px;margin-top:14px}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{min-height:56px;text-align:left;padding:12px 14px;border-radius:18px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;display:flex;gap:10px;align-items:center;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.opt:hover{transform:translateY(-2px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:var(--butter);display:grid;place-items:center;font-size:14px}
.opt.right{background:#E6F5EA;border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.opt.wrong{background:#FDECEF;border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:popin .3s}
.fb.ok{background:#E6F5EA}.fb.no{background:#FDECEF}
.fb .mini{width:64px;flex:none}
.termchips{display:flex;flex-wrap:wrap;gap:8px}
.term{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-weight:700;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.term span{color:var(--ink2);font-weight:700}
.notes{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.notes li{background:#fff;border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:28px 1fr;gap:8px}
.notes li::before{content:"✿";color:var(--rose);font-size:18px;line-height:1.4}
.notes b{background:linear-gradient(transparent 60%,var(--butter) 60%)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),#EEE5DC 0);display:grid;place-items:center;flex:none}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-weight:800;font-size:14px}
/* shop / collection */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs button{flex:none;min-height:44px;padding:6px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--pink);border-color:var(--rose)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px}
.item{background:#fff;border-radius:20px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;min-width:0}
.item .pic{width:100%;aspect-ratio:1;border-radius:16px;background:var(--cream);display:grid;place-items:center;overflow:hidden}
.item .pic svg{width:86%;height:86%}
.item .nm{font-weight:800;font-size:14px;line-height:1.3}
.item .sub{font-size:12px;color:var(--ink2)}
.item.locked .pic{filter:grayscale(1) opacity(.35)}
.item .own{position:absolute;top:8px;right:8px;background:var(--good);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 8px}
.trophy .pic{background:linear-gradient(var(--butter),#fff)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:#fff;border-radius:18px;padding:10px 16px;box-shadow:var(--shadow);font-weight:800;border:2px solid var(--butter);animation:pop .35s cubic-bezier(.3,1.6,.5,1);max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:3px;z-index:84;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
.match{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.match{grid-template-columns:repeat(4,1fr)}}
.mc{min-height:78px;border-radius:16px;background:var(--lav);border:2px solid #CDBDE5;font-weight:800;font-size:14px;padding:6px;transition:transform .25s}
.mc.up{background:#fff}
.mc.done{background:var(--sky);border-color:#A9D3B3;opacity:.75}
.mc.bad{animation:shake .35s}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;letter-spacing:1px;background:#fff;border:2px dashed var(--rose);border-radius:14px;padding:10px;word-break:break-all;user-select:all}
textarea,input[type=text]{width:100%;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;color:var(--ink);min-height:48px}
.foot{font-size:12px;color:var(--ink2);text-align:center;margin-top:28px}
.welcome{max-width:520px;margin:6vh auto 0;text-align:center;display:grid;gap:16px;justify-items:center}
.welcome h1{font-size:30px;font-weight:800}
.lang2{display:flex;gap:10px}
.mistake{background:#fff;border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:14px}
.pips{display:flex;gap:4px}.pips i{width:12px;height:12px;border-radius:50%;background:#EEE5DC}.pips i.on{background:var(--good)}
.empty{text-align:center;padding:24px}
.empty svg{width:130px}
.pet .spin{animation:spin 3s linear infinite;transform-origin:166px 108px}
.pet .steam{animation:tw 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.item.special{background:linear-gradient(160deg,#FFF8E1,#FFFFFF 60%)}
.item .spec{position:absolute;top:8px;left:8px;background:var(--butter);color:var(--ink);border-radius:999px;font-size:11px;font-weight:800;padding:1px 8px;z-index:1}
.item.special.locked .pic{filter:grayscale(1) opacity(.35)}
.vlist{display:grid;gap:8px}
@media (min-width:640px){.vlist.two{grid-template-columns:1fr 1fr}}
.vh{font-size:15px;margin:14px 0 8px}
.vterm{display:grid;grid-template-columns:44px 44px minmax(0,1fr);gap:8px;align-items:center;background:#fff;border-radius:16px;padding:6px 10px 6px 6px;border:2px solid transparent;transition:background .2s}
.vterm.now{border-color:var(--rose);background:var(--pink)}
.vt{min-width:0;line-height:1.35}
.vt b{font-size:15px}
.vt .zh{font-size:13px;color:var(--ink2);font-weight:700}
.ipa{font-family:'Noto Sans','Segoe UI','Lucida Sans Unicode','Arial Unicode MS',system-ui,sans-serif;color:#7A6BB0;font-size:14px;white-space:normal;overflow-wrap:anywhere}
.say{width:44px;height:44px;border-radius:14px;background:var(--sky);border:2px solid #A9D3B3;font-size:18px;display:inline-grid;place-items:center;flex:none}
.say.slow{background:var(--butter);border-color:#EBD89A}
.say.inl{margin-right:8px;vertical-align:middle}
.say.talk{animation:boing .5s cubic-bezier(.3,1.6,.5,1)}
/* pop-ups */
.pop-ov{position:fixed;inset:0;z-index:85;background:rgba(91,75,73,.3);display:grid;place-items:center;padding:16px}
.pop-card{position:relative;overflow:hidden;background:var(--cream);border-radius:32px;padding:22px 18px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 18px 40px rgba(91,75,73,.25);border:4px solid #fff;animation:jelly .75s cubic-bezier(.3,1.6,.5,1)}
.pop-in{position:relative;z-index:1}
.pop-card h2{font-size:21px;margin-top:6px}
.pop-card p{margin:8px 0 0}
@keyframes jelly{0%{transform:scale(.3) rotate(-8deg);opacity:0}55%{transform:scale(1.07) rotate(2deg);opacity:1}75%{transform:scale(.96) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
.pop-pet{width:120px;margin:0 auto;animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-16px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.06,.94)}}
.pop-flame{position:relative;width:74px;margin:0 auto -6px}
.pop-flame .flame{width:74px;display:block;transform-origin:50% 100%;animation:flick 1.2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(1.07,1.13) rotate(3deg)}}
.pop-num{position:absolute;right:-26px;top:0;background:#fff;border:3px solid #F7A06B;color:#D9683A;font-weight:800;font-size:20px;min-width:40px;height:40px;border-radius:999px;display:grid;place-items:center;padding:0 6px;animation:popin .5s .3s both cubic-bezier(.3,1.6,.5,1)}
.pop-meter{height:12px;border-radius:999px;background:#F3ECE6;overflow:hidden;margin-top:12px;border:2px solid #fff}
.pop-meter i{display:block;height:100%;background:linear-gradient(90deg,#FBD46D,#F7A06B);border-radius:999px;animation:grow 1s .3s both cubic-bezier(.3,1.3,.5,1)}
@keyframes grow{from{width:0}}
.floater{position:absolute;bottom:-24px;opacity:0;animation:rise 3.3s ease-in infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0) scale(.6) rotate(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-440px) scale(1.15) rotate(40deg);opacity:0}}
.pop-prize{position:relative;width:170px;height:170px;margin:0 auto}
.rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#FFF1C5 0 12deg,transparent 12deg 24deg);animation:spin 9s linear infinite}
.prize-pic{position:absolute;inset:18px;display:grid;place-items:center;animation:spinin 1s cubic-bezier(.3,1.6,.5,1)}
.prize-pic svg{width:100%;height:100%}
@keyframes spinin{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ovroot"></div>
<div id="poproot"></div>
<script>
/* ===== CONTENT: S1 Science (HK junior science textbook, Units 1–4) =====
   M(bloom, qEN, qZH, [[correctEN,correctZH],[wrongEN,wrongZH],...], explainEN, explainZH)  – first option is correct; shuffled at runtime

notes:[['Science is the study of phenomena and events in Nature.','科學是研究大自然中的現象和事件的學問。'],

M(2,'People once believed the Sun moved around the Earth. Better telescopes later showed the Earth moves around the Sun. What does this show?','古人相信太陽圍繞地球運行，後來更好的望遠鏡顯示地球圍繞太陽運行。這說明了甚麼？',[['Scientific knowledge is subject to change','科學知識會隨時間改變'],['Science can explain everything','科學可以解釋一切'],['Telescopes are always wrong','望遠鏡總是出錯'],['Scientists never make mistakes','科學家從不犯錯']],'New evidence changed the old idea.','新證據改變了舊的想法。'),

M(5,'Which statement about science is the BEST judgement?','以下哪一項對科學的評價最恰當？',[['Science brings many benefits, but we must use it responsibly','科學帶來很多好處，但我們必須負責任地使用'],['Science is useless in daily life','科學在日常生活中毫無用處'],['Science can solve every problem instantly','科學可以立即解決所有問題'],['Only scientists need to learn science','只有科學家才需要學科學']],'Balanced view: benefits + responsibility + limitations.','平衡的看法：有好處，但要負責任使用，亦有局限。'),
M(6,'You want to find out whether bread grows mould faster in a warm place. What should you do FIRST as a scientist?','你想知道麵包在溫暖的地方是否較快發霉。作為科學家，你應首先做甚麼？',[['Ask a clear question and plan a fair test','提出清晰的問題並設計公平測試'],['Guess the answer and stop','猜一個答案就完成'],['Ask friends to vote','請朋友投票'],['Eat the bread','把麵包吃掉']],'Science starts from a testable question, then an experiment gives evidence.','科學由一個可測試的問題開始，再以實驗取得證據。')

{id:'1.2',en:'Practice of science',zh:'科學實踐',

qs:[

{id:'1.3',en:'Safety in the laboratory',zh:'實驗室安全',

qs:[

M(1,'Which item protects your eyes during experiments?','做實驗時，哪一項保護你的眼睛？',[['Safety spectacles','安全眼鏡'],['Fire blanket','滅火氈'],['Fume cupboard','通風櫥'],['Sand bucket','滅火沙桶']],'Always wear safety spectacles in the lab.','在實驗室內必須佩戴安全眼鏡。'),

{id:'1.4',en:'Laboratory apparatus & practical skills',zh:'實驗室儀器和基本實驗技巧',
notes:[['Common apparatus: test tube, boiling tube, beaker, conical flask, Bunsen burner, tripod, wire gauze, measuring cylinder, dropper, spatula, filter funnel.','常用儀器：試管、大試管、燒杯、錐形瓶、本生燈、三腳架、鐵絲網、量筒、滴管、刮勺、漏斗。'],
['Instruments & units: length – ruler (mm, cm, m); volume – measuring cylinder (cm³, mL, L); mass – electronic balance (mg, g, kg); temperature – thermometer (°C); time – stopwatch (s, min, h).','儀器與單位：長度－尺（mm, cm, m）；體積－量筒（cm³, mL, L）；質量－電子天平（mg, g, kg）；溫度－溫度計（°C）；時間－秒錶（s, min, h）。'],
['Read a measuring cylinder at <b>eye level</b>, at the <b>bottom of the meniscus</b>.','讀取量筒時視線要與<b>彎液面底部</b>保持<b>水平</b>。'],
['Every measurement has an <b>error</b> = half of the smallest division on the scale.','每個量度都有<b>誤差</b>＝刻度最小分度的一半。'],
['Lighting a Bunsen burner: <b>close the air hole</b> → lighter above chimney → turn on gas → slowly open air hole.','點燃本生燈：<b>關上空氣孔</b> → 把點火器放在燈管上方 → 開氣 → 慢慢打開空氣孔。'],
['<b>Luminous flame</b> (air hole closed): yellow, irregular, cooler, quiet. <b>Non-luminous flame</b> (air hole open): blue, regular, hotter, noisy – used for heating.','<b>光焰</b>（空氣孔關上）：黃色、形狀不規則、較冷、安靜。<b>無光焰</b>（空氣孔打開）：藍色、形狀規則、較熱、嘈吵－用來加熱。']],
terms:[['beaker','燒杯'],['conical flask','錐形瓶'],['Bunsen burner','本生燈'],['tripod','三腳架'],['wire gauze','鐵絲網'],['measuring cylinder','量筒'],['meniscus','彎液面'],['error','誤差'],['luminous flame','光焰'],['non-luminous flame','無光焰'],['strike back','回擊']],
qs:[
M(1,'Which instrument measures the VOLUME of a liquid accurately?','哪種儀器可準確量度液體的體積？',[['Measuring cylinder','量筒'],['Beaker','燒杯'],['Thermometer','溫度計'],['Stopwatch','秒錶']],'Measuring cylinders have fine scales for volume.','量筒有精細的體積刻度。'),
M(1,'Which is a unit of MASS?','以下哪一個是質量的單位？',[['kilogram (kg)','千克 (kg)'],['millilitre (mL)','毫升 (mL)'],['metre (m)','米 (m)'],['degree Celsius (°C)','攝氏度 (°C)']],'Mass: mg, g, kg.','質量單位：mg、g、kg。'),
M(1,'Before lighting a Bunsen burner, the air hole should be…','點燃本生燈前，空氣孔應該……',[['closed','關上'],['fully open','完全打開'],['covered with tape','用膠紙封住'],['removed','拆除']],'A closed air hole prevents strike back and gives a visible luminous flame.','關上空氣孔可防止回擊，並產生容易看見的光焰。'),
M(1,'What is the colour of a non-luminous flame?','無光焰是甚麼顏色的？',[['Blue','藍色'],['Yellow','黃色'],['Red','紅色'],['Green','綠色']],'Non-luminous = blue, hot, noisy.','無光焰：藍色、較熱、嘈吵。'),
T(2,'A luminous flame is hotter than a non-luminous flame.','光焰比無光焰更熱。',false,'The non-luminous (blue) flame is hotter, so we use it for heating.','無光焰（藍色）較熱，所以用來加熱。'),
T(2,'We should read a measuring cylinder with our eyes level with the bottom of the meniscus.','讀取量筒時，視線應與彎液面的底部保持水平。',true,'Reading from above or below gives a wrong value.','從上方或下方讀數會得出錯誤數值。'),
M(2,'Which piece of apparatus holds a test tube while heating it?','加熱試管時，用哪件儀器夾住試管？',[['Test tube holder','試管夾'],['Test tube rack','試管架'],['Spatula','刮勺'],['Wire gauze','鐵絲網']],'A test tube holder keeps your fingers away from heat.','試管夾令手指遠離熱源。'),
M(3,'A ruler has 1 mm divisions. What is the error of a reading?','尺的最小分度是 1 mm，讀數的誤差是多少？',[['0.5 mm','0.5 mm'],['1 mm','1 mm'],['0.1 mm','0.1 mm'],['2 mm','2 mm']],'Error = half of the smallest division = 0.5 mm.','誤差＝最小分度的一半＝0.5 mm。'),
M(3,'When heating liquid in a test tube, you should…','在試管中加熱液體時，你應該……',[['point the mouth of the tube away from people','把試管口指向沒有人的方向'],['fill the tube to the top','把試管注滿'],['look into the tube from above','從上方望入試管'],['hold the tube with bare hands','徒手拿着試管']],'Hot liquid may shoot out; also fill no more than 1/3 and shake gently.','熱液體可能噴出；液體不超過三分之一並輕輕搖動。'),
M(4,'Mei opens the air hole and the flame becomes blue and noisy. What caused the change?','Mei 打開空氣孔，火焰變成藍色並發出聲響，原因是甚麼？',[['More air mixes with the gas, so it burns completely','更多空氣與燃氣混合，燃燒得較完全'],['Less gas is supplied','燃氣供應減少'],['The burner is broken','本生燈壞了'],['The flame has gone out','火焰熄滅了']],'Extra air (oxygen) gives complete burning – hotter blue flame.','更多空氣（氧）令燃燒較完全，產生較熱的藍色火焰。'),
M(4,'The flame suddenly burns at the bottom of the chimney with a roaring sound. This is…','火焰突然在燈管底部燃燒並發出隆隆聲，這是……',[['strike back – turn off the gas at once','回擊－立即關掉燃氣'],['normal – continue heating','正常－繼續加熱'],['a luminous flame','光焰'],['a sign of low temperature','溫度低的表現']],'Strike back is dangerous; turn off the gas tap and let the burner cool.','回擊很危險，要立即關掉氣掣並讓本生燈冷卻。'),
M(5,'A student reads the TOP of the meniscus of water in a measuring cylinder. The reading will be…','學生讀取量筒內水的彎液面頂部，讀數會……',[['too large','偏大'],['too small','偏小'],['correct','正確'],['zero','是零']],'For water we read the bottom of the curved surface.','讀水的體積要讀彎液面的底部。'),
M(6,'You must heat 20 cm³ of water to boiling safely. Which set of apparatus is BEST?','你要安全地把 20 cm³ 的水加熱至沸騰，哪組儀器最合適？',[['Beaker on wire gauze on tripod, non-luminous flame','燒杯放在三腳架上的鐵絲網上，用無光焰'],['Measuring cylinder held over a luminous flame','把量筒放在光焰上'],['Test tube rack on the Bunsen burner','把試管架放在本生燈上'],['Reagent bottle held by hand','用手拿着試劑瓶']],'Wire gauze spreads heat; the blue flame is hottest. Never heat a measuring cylinder.','鐵絲網令熱力平均分佈；藍色火焰最熱。切勿加熱量筒。')
]}
]},
{id:2,en:'Water',zh:'水',col:'#D8F3DC',ink:'#4E8F6A',icon:'drop',sections:[
{id:'2.1',en:'Change in states of water',zh:'水的物態變化',
notes:[['Water exists in 3 physical states: <b>solid</b> (ice), <b>liquid</b> (water), <b>gas</b> (water vapour / steam).','水有三種物態：<b>固態</b>（冰）、<b>液態</b>（水）、<b>氣態</b>（水汽／蒸汽）。'],
['<b>Melting</b> (0 °C), <b>boiling</b> (100 °C) and <b>evaporation</b> (below 100 °C) <b>absorb</b> energy.','<b>熔化</b>（0 °C）、<b>沸騰</b>（100 °C）和<b>蒸發</b>（低於 100 °C）會<b>吸收</b>能量。'],
['<b>Freezing</b> (0 °C) and <b>condensation</b> <b>release</b> energy.','<b>凝固</b>（0 °C）和<b>凝結</b>會<b>釋放</b>能量。'],
['During melting and boiling, the temperature <b>stays constant</b> although heat is supplied.','在熔化和沸騰期間，雖然持續加熱，溫度<b>保持不變</b>。'],
['Evaporation happens only at the <b>surface</b>; boiling happens throughout the liquid.','蒸發只在液體<b>表面</b>發生；沸騰則在整個液體內發生。']],
terms:[['physical state','物態'],['melting','熔化'],['melting point','熔點'],['freezing','凝固'],['boiling','沸騰'],['boiling point','沸點'],['evaporation','蒸發'],['condensation','凝結'],['water vapour','水汽'],['steam','蒸汽']],
qs:[
M(1,'What is the melting point of pure ice?','純冰的熔點是多少？',[['0 °C','0 °C'],['100 °C','100 °C'],['37 °C','37 °C'],['−10 °C','−10 °C']],'Ice melts at 0 °C.','冰在 0 °C 熔化。'),
M(1,'The change from water vapour to liquid water is called…','由水汽變成液態水的過程稱為……',[['condensation','凝結'],['evaporation','蒸發'],['melting','熔化'],['freezing','凝固']],'Gas → liquid = condensation.','氣態 → 液態＝凝結。'),
M(1,'The change from liquid water to ice is called…','由液態水變成冰的過程稱為……',[['freezing','凝固'],['melting','熔化'],['boiling','沸騰'],['condensation','凝結']],'Liquid → solid = freezing (0 °C).','液態 → 固態＝凝固（0 °C）。'),
T(2,'Evaporation can happen at temperatures below 100 °C.','蒸發可以在低於 100 °C 的溫度發生。',true,'Wet clothes dry at room temperature by evaporation.','濕衣服在室溫下也會因蒸發而變乾。'),
T(2,'Freezing absorbs energy from the surroundings.','凝固時會從周圍吸收能量。',false,'Freezing RELEASES energy; melting absorbs energy.','凝固會釋放能量；熔化才會吸收能量。'),
M(2,'Which processes ABSORB energy?','以下哪些過程會吸收能量？',[['Melting, boiling and evaporation','熔化、沸騰和蒸發'],['Freezing and condensation','凝固和凝結'],['Freezing and boiling','凝固和沸騰'],['Condensation only','只有凝結']],'Solid→liquid→gas needs energy.','固態→液態→氣態都需要吸收能量。'),
M(3,'Water droplets form on the outside of a cold can of drink. Where does the water come from?','凍罐裝飲品外面出現水珠，水從哪裏來？',[['Water vapour in the air condenses on the cold can','空氣中的水汽在凍罐上凝結'],['The drink leaks through the can','飲品從罐中滲出'],['The can melts','罐熔化了'],['Ice evaporates','冰蒸發了']],'Cold surface cools water vapour → condensation.','冷的表面令水汽冷卻而凝結。'),
M(3,'Ice is heated steadily. While it is melting, its temperature…','持續加熱冰，當冰正在熔化時，溫度會……',[['stays at 0 °C','維持在 0 °C'],['rises quickly','迅速上升'],['falls','下降'],['jumps to 100 °C','跳升至 100 °C']],'Energy is used to change state, so the temperature stays constant.','能量用來改變物態，所以溫度保持不變。'),
M(4,'On a heating graph of ice → steam, the two flat parts show…','在冰 → 蒸汽的加熱曲線上，兩段平坦的部分表示……',[['melting at 0 °C and boiling at 100 °C','在 0 °C 熔化和在 100 °C 沸騰'],['the heater was switched off','加熱器被關掉'],['freezing and condensation','凝固和凝結'],['water cooling down','水正在冷卻']],'Temperature is constant during a change of state.','改變物態期間溫度保持不變。'),
M(4,'What is the difference between evaporation and boiling?','蒸發和沸騰有甚麼分別？',[['Evaporation happens only at the surface below 100 °C; boiling happens throughout the liquid at 100 °C','蒸發在低於 100 °C 時只在表面發生；沸騰在 100 °C 時在整個液體中發生'],['They are exactly the same','兩者完全相同'],['Boiling releases energy','沸騰會釋放能量'],['Evaporation only happens at 100 °C','蒸發只在 100 °C 發生']],'Both turn liquid into gas, but under different conditions.','兩者都把液體變成氣體，但條件不同。'),
M(5,'Sweating cools us down on a hot day. Which explanation is BEST?','在炎熱天氣中流汗能令我們降溫，哪個解釋最好？',[['Sweat evaporates and absorbs heat from the skin','汗水蒸發時從皮膚吸收熱'],['Sweat is colder than air','汗水比空氣冷'],['Sweat releases heat when it evaporates','汗水蒸發時釋放熱'],['Sweat freezes on the skin','汗水在皮膚上凝固']],'Evaporation absorbs energy → skin loses heat.','蒸發會吸收能量，令皮膚失去熱。'),
M(6,'You want to show that condensation releases energy using steam. Which observation would support this?','你想用蒸汽證明凝結會釋放能量，哪個觀察可以支持？',[['Cold water gets warmer when steam condenses in it','蒸汽在冷水中凝結時，冷水變暖'],['Ice melts in the sun','冰在陽光下熔化'],['Water boils at 100 °C','水在 100 °C 沸騰'],['Steam is invisible','蒸汽是看不見的']],'The energy released by condensing steam warms the water.','蒸汽凝結釋放的能量令水變暖。')
]},
{id:'2.2',en:'Water cycle',zh:'水循環',
notes:[['The <b>water cycle</b>: <b>evaporation</b> → <b>condensation</b> (clouds) → <b>transportation</b> (by wind) → <b>precipitation</b> (rain).','<b>水循環</b>：<b>蒸發</b> → <b>凝結</b>（形成雲）→ <b>運送</b>（被風吹走）→ <b>降水</b>（下雨）。'],
['The Sun provides the energy for evaporation.','太陽提供蒸發所需的能量。'],
['Rate of evaporation is <b>higher</b> when: surface area is <b>larger</b>, humidity is <b>lower</b>, temperature is <b>higher</b>, air speed is <b>higher</b>.','以下情況蒸發速率<b>較高</b>：表面面積<b>較大</b>、濕度<b>較低</b>、溫度<b>較高</b>、風速<b>較高</b>。']],
terms:[['water cycle','水循環'],['precipitation','降水'],['humidity','濕度'],['rate of evaporation','蒸發速率'],['surface area','表面面積']],
qs:[
M(1,'Water falling from clouds as rain is called…','水從雲中以雨的形式落下稱為……',[['precipitation','降水'],['evaporation','蒸發'],['condensation','凝結'],['transportation','運送']],'Rain, snow and hail are precipitation.','雨、雪和冰雹都是降水。'),
M(1,'Clouds form when water vapour…','水汽怎樣形成雲？',[['cools down and condenses','冷卻並凝結'],['heats up and boils','受熱並沸騰'],['freezes into ice cubes on land','在地上凝固成冰塊'],['dissolves in the sea','溶解在海中']],'Rising vapour cools and condenses into tiny droplets.','上升的水汽冷卻並凝結成小水點。'),
M(1,'Which provides the energy that drives the water cycle?','哪一項為水循環提供能量？',[['The Sun','太陽'],['The Moon','月球'],['Wind turbines','風力發電機'],['Rocks','岩石']],'The Sun heats water, causing evaporation.','太陽加熱水，使水蒸發。'),
T(2,'Clouds can be carried to other places by wind.','雲可以被風吹到其他地方。',true,'This is the transportation stage.','這是運送階段。'),
T(2,'Wet clothes dry faster on a humid day.','濕衣服在潮濕的日子乾得較快。',false,'High humidity LOWERS the rate of evaporation.','濕度高會降低蒸發速率。'),
M(2,'Put the water cycle in order starting from the sea.','由海洋開始，把水循環排好次序。',[['Evaporation → condensation → transportation → precipitation','蒸發 → 凝結 → 運送 → 降水'],['Precipitation → evaporation → transportation → condensation','降水 → 蒸發 → 運送 → 凝結'],['Condensation → evaporation → precipitation → transportation','凝結 → 蒸發 → 降水 → 運送'],['Transportation → precipitation → condensation → evaporation','運送 → 降水 → 凝結 → 蒸發']],'Sea water evaporates first, then forms clouds, moves, and falls.','海水先蒸發，再形成雲、被風吹走，然後落下。'),
M(3,'Which spreads out wet clothes to dry fastest?','怎樣晾衣服會乾得最快？',[['Spread them out in a sunny, windy place','攤開放在有陽光和有風的地方'],['Fold them in a closed bathroom','摺好放在密封的浴室'],['Pile them in a basket','堆在籃子裏'],['Hang them in a humid basement','掛在潮濕的地庫']],'Large surface area, high temperature, high air speed, low humidity.','表面面積大、溫度高、風速高、濕度低。'),
M(3,'Why does water in a plate dry faster than the same volume in a cup?','為甚麼碟中的水比杯中相同體積的水乾得快？',[['The plate gives a larger surface area exposed to air','碟子令水有較大的表面面積接觸空氣'],['The plate is heavier','碟子較重'],['The cup is hotter','杯子較熱'],['Plates absorb water','碟子吸收了水']],'Larger surface area → higher rate of evaporation.','表面面積較大 → 蒸發速率較高。'),
M(4,'Using a hair dryer on wet hair increases evaporation mainly by…','用風筒吹濕頭髮，主要透過哪些方法增加蒸發？',[['raising temperature and air speed','提高溫度和風速'],['increasing humidity','增加濕度'],['decreasing surface area','減少表面面積'],['adding more water','加入更多水']],'Hot moving air speeds up evaporation.','熱而流動的空氣會加快蒸發。'),
M(4,'In an experiment, two identical wet cloths are placed in rooms at 20 °C and 30 °C. What is the independent variable?','實驗中，兩塊相同的濕布分別放在 20 °C 和 30 °C 的房間。自變量是甚麼？',[['Temperature','溫度'],['Time taken to dry','變乾所需時間'],['Size of cloth','布的大小'],['Type of cloth','布的種類']],'Temperature is changed; drying time is measured.','改變溫度，量度變乾所需時間。'),
M(5,'Hong Kong has high humidity in spring. Which prediction is MOST reasonable?','香港春天濕度很高，哪個推斷最合理？',[['Clothes hung indoors take longer to dry','在室內晾的衣服需要較長時間才乾'],['Clothes dry faster than in autumn','衣服比秋天乾得更快'],['No evaporation happens at all','完全不會發生蒸發'],['It never rains in spring','春天從不下雨']],'Humid air already holds a lot of water vapour, so evaporation slows.','潮濕的空氣已含大量水汽，蒸發會減慢。'),
M(6,'Design a solar still to get water from wet soil. Which feature is MOST important?','設計一個太陽能蒸餾器從濕泥中取水，哪個特徵最重要？',[['A cool cover where water vapour can condense and drip into a cup','一個可讓水汽凝結並滴入杯中的冷蓋'],['A dark box with no opening for light','一個完全不透光的箱子'],['A fan blowing vapour away','一把把水汽吹走的風扇'],['Freezing the soil first','先把泥土冷凍']],'It copies the water cycle: evaporation then condensation.','它模仿水循環：先蒸發，再凝結。')
]},
{id:'2.3',en:'Dissolving',zh:'溶解',
notes:[['A <b>solute</b> dissolves in a <b>solvent</b> to form a <b>solution</b>. Water is a good solvent.','<b>溶質</b>溶解在<b>溶劑</b>中形成<b>溶液</b>。水是良好的溶劑。'],
['Substances that dissolve are <b>soluble</b>; those that do not are <b>insoluble</b>.','能溶解的物質是<b>可溶的</b>；不能溶解的是<b>不可溶的</b>。'],
['Rate of dissolving is higher when: <b>stirred</b>, water is <b>hotter</b>, solute pieces are <b>smaller</b>.','以下情況溶解速率較高：<b>攪拌</b>、水溫<b>較高</b>、溶質顆粒<b>較小</b>。'],
['<b>Solubility</b> = amount of a substance that dissolves in a <b>fixed amount of water at a given temperature</b>.','<b>溶解度</b>＝在<b>指定溫度下</b>，<b>定量的水</b>中能溶解某物質的份量。'],
['A <b>saturated</b> solution cannot dissolve any more solute. Different substances have different solubilities, and solubility changes with temperature.','<b>飽和</b>溶液不能再溶解更多溶質。不同物質的溶解度不同，溶解度亦會隨溫度改變。']],
terms:[['dissolve','溶解'],['solvent','溶劑'],['solute','溶質'],['solution','溶液'],['soluble','可溶的'],['insoluble','不可溶的'],['rate of dissolving','溶解速率'],['saturated','飽和'],['solubility','溶解度']],
qs:[
M(1,'In salt water, the salt is the…','在鹽水中，鹽是……',[['solute','溶質'],['solvent','溶劑'],['solution','溶液'],['residue','殘餘物']],'The substance that dissolves is the solute.','被溶解的物質是溶質。'),
M(1,'In salt water, the water is the…','在鹽水中，水是……',[['solvent','溶劑'],['solute','溶質'],['precipitate','沉澱物'],['filtrate','濾液']],'The liquid that does the dissolving is the solvent.','負責溶解其他物質的液體是溶劑。'),
M(1,'Which substance is INSOLUBLE in water?','以下哪種物質不溶於水？',[['Sand','沙'],['Sugar','糖'],['Salt','鹽'],['Instant coffee powder','即溶咖啡粉']],'Sand does not dissolve – it settles.','沙不會溶解，只會沉底。'),
T(2,'Stirring makes sugar dissolve faster.','攪拌可令糖溶解得較快。',true,'Stirring brings fresh water to the solute.','攪拌令新鮮的水接觸溶質。'),
T(2,'All substances have the same solubility in water.','所有物質在水中的溶解度都相同。',false,'Different substances have different solubilities.','不同物質的溶解度不同。'),
M(2,'A solution that cannot dissolve any more solute at that temperature is…','在該溫度下不能再溶解更多溶質的溶液是……',[['saturated','飽和的'],['insoluble','不可溶的'],['pure','純的'],['diluted','稀釋的']],'Extra solute stays undissolved in a saturated solution.','在飽和溶液中，多加的溶質不會溶解。'),
M(3,'Which sugar dissolves FASTEST in the same cup of water?','在同一杯水中，哪種糖溶解得最快？',[['Sugar powder (icing sugar)','糖粉'],['A sugar cube','方糖'],['Rock sugar','冰糖'],['A big lump of sugar','一大塊糖']],'Smaller pieces have more surface in contact with water.','顆粒越小，與水接觸的表面越多。'),
M(3,'Lemon tea powder dissolves faster in hot water because…','檸檬茶粉在熱水中溶解得較快，因為……',[['higher temperature increases the rate of dissolving','溫度較高令溶解速率增加'],['hot water has less water','熱水較少水'],['hot water is a solute','熱水是溶質'],['the powder is heavier','茶粉較重']],'Higher temperature → higher rate of dissolving.','溫度較高 → 溶解速率較高。'),
M(4,'To compare the solubility of salt and sugar fairly, what must be kept the same?','要公平比較鹽和糖的溶解度，甚麼必須保持相同？',[['Volume and temperature of water','水的體積和溫度'],['Type of solute','溶質的種類'],['Mass of solute that dissolves','能溶解的溶質質量'],['Colour of the cup','杯的顏色']],'Solubility is defined for a fixed amount of water at a given temperature.','溶解度是指在指定溫度下定量的水所能溶解的份量。'),
M(4,'At 20 °C, 100 g water dissolves 36 g salt. You add 40 g salt. What happens?','在 20 °C 時，100 g 水可溶解 36 g 鹽。你加入 40 g 鹽，會怎樣？',[['About 4 g stays undissolved; the solution is saturated','約 4 g 鹽不會溶解，溶液已飽和'],['All 40 g dissolves','全部 40 g 都會溶解'],['None of the salt dissolves','所有鹽都不會溶解'],['The water turns into salt','水變成鹽']],'Only 36 g can dissolve; the rest remains.','只可溶解 36 g，餘下的會留下。'),
M(5,'Tim says "Stirring increases the solubility of sugar." Is he right?','Tim 說「攪拌會增加糖的溶解度。」他對嗎？',[['No – stirring increases the RATE of dissolving, not the solubility','不對－攪拌增加的是溶解速率，而不是溶解度'],['Yes – stirring lets more sugar dissolve in total','對－攪拌可令總共更多糖溶解'],['Yes – stirring changes the temperature a lot','對－攪拌大幅改變溫度'],['No – stirring stops dissolving','不對－攪拌會停止溶解']],'Rate (how fast) ≠ solubility (how much).','速率（多快）≠ 溶解度（多少）。'),
M(6,'You want to make a sugar solution as fast as possible for a science fair drink. Which plan is BEST?','你想在科學展覽中最快調製一杯糖水，哪個計劃最好？',[['Use fine sugar, warm water and stir','用幼糖、暖水並攪拌'],['Use a sugar cube in iced water, no stirring','用方糖放入冰水，不攪拌'],['Use rock sugar and wait','用冰糖然後等待'],['Freeze the sugar first','先把糖冷凍']],'Combine all three factors that increase the rate.','結合三個增加溶解速率的因素。')
]},
{id:'2.4',en:'Water purification',zh:'水的淨化',
notes:[['Natural water contains <b>insoluble impurities</b> (sand, plant debris), <b>soluble impurities</b> (mineral salts) and <b>microorganisms</b> (bacteria, <i>Amoeba</i>).','天然水含有<b>不可溶雜質</b>（沙、植物碎屑）、<b>可溶雜質</b>（礦物鹽）和<b>微生物</b>（細菌、變形蟲）。'],
['<b>Sedimentation</b>: heavy insoluble impurities settle to the bottom. <b>Alum</b> speeds it up.','<b>沉積法</b>：較重的不可溶雜質沉到底部。<b>明礬</b>可加快沉積。'],
['<b>Filtration</b>: water passes through a filter; the liquid that passes through is the <b>filtrate</b>, what stays behind is the <b>residue</b>. Removes insoluble impurities.','<b>過濾法</b>：水通過過濾器；穿過的液體是<b>濾液</b>，留下的是<b>殘餘物</b>。可除去不可溶雜質。'],
['<b>Distillation</b>: boiling → condensation. The pure water collected is the <b>distillate</b>. Removes soluble & insoluble impurities and microorganisms, but costs a lot of energy.','<b>蒸餾法</b>：沸騰 → 凝結。收集到的純水是<b>餾液</b>。可除去可溶及不可溶雜質和微生物，但耗用大量能量。']],
terms:[['impurity','雜質'],['microorganism','微生物'],['sedimentation','沉積法'],['filtration','過濾法'],['distillation','蒸餾法'],['alum','明礬'],['filtrate','濾液'],['residue','殘餘物'],['distillate','餾液'],['filter paper','濾紙']],
qs:[
M(1,'In filtration, the clear liquid that passes through the filter paper is the…','在過濾中，穿過濾紙的清澈液體稱為……',[['filtrate','濾液'],['residue','殘餘物'],['distillate','餾液'],['sediment','沉積物']],'Filtrate passes through; residue stays on the paper.','濾液穿過濾紙；殘餘物留在濾紙上。'),
M(1,'Pure water collected from distillation is called…','從蒸餾收集到的純水稱為……',[['distillate','餾液'],['filtrate','濾液'],['residue','殘餘物'],['solute','溶質']],'Distillate = product of distillation.','餾液＝蒸餾的產物。'),
M(1,'Which substance speeds up sedimentation?','哪種物質可以加快沉積？',[['Alum','明礬'],['Sugar','糖'],['Chlorine','氯'],['Fluoride','氟化物']],'Alum makes tiny particles clump together and settle faster.','明礬令細小顆粒聚集，更快沉底。'),
T(2,'Clear stream water is always safe to drink.','清澈的溪水一定可以安全飲用。',false,'It may contain soluble impurities and microorganisms we cannot see.','溪水可能含有看不見的可溶雜質和微生物。'),
T(2,'Filtration can remove insoluble impurities such as sand.','過濾法可以除去沙等不可溶雜質。',true,'Sand is trapped as residue on the filter.','沙會成為殘餘物留在過濾器上。'),
M(2,'Which method removes SOLUBLE impurities such as salt from water?','哪種方法可以除去水中如鹽等可溶雜質？',[['Distillation','蒸餾法'],['Filtration','過濾法'],['Sedimentation','沉積法'],['Adding alum','加入明礬']],'Salt stays behind when water boils off.','水沸騰變成蒸汽，鹽被留下。'),
M(3,'Muddy water is filtered. The mud left on the filter paper is the…','把泥水過濾，留在濾紙上的泥是……',[['residue','殘餘物'],['filtrate','濾液'],['distillate','餾液'],['solvent','溶劑']],'What cannot pass through = residue.','不能穿過濾紙的是殘餘物。'),
M(3,'Put the steps of distillation of sea water in order.','把蒸餾海水的步驟排序。',[['Boil sea water → steam → condense → collect distillate','煮沸海水 → 蒸汽 → 凝結 → 收集餾液'],['Condense → boil → filter → collect','凝結 → 煮沸 → 過濾 → 收集'],['Add alum → boil → collect residue','加明礬 → 煮沸 → 收集殘餘物'],['Filter → freeze → melt','過濾 → 冷凍 → 熔化']],'Boiling then condensation.','先沸騰，再凝結。'),
M(4,'Why is distillation NOT used to purify all of Hong Kong\'s drinking water?','為甚麼香港不用蒸餾法淨化全部食水？',[['Heating a huge amount of water costs too much energy','加熱大量的水耗費太多能量'],['Distillation cannot remove salt','蒸餾不能除去鹽'],['Distillate is dirty','餾液很髒'],['It adds microorganisms','它會加入微生物']],'Distillation works well but is very expensive at large scale.','蒸餾效果好，但大規模使用成本很高。'),
M(4,'A filtration column has layers of gravel, coarse sand and fine sand. What does it mainly remove?','過濾柱內有礫石、粗沙和幼沙層，它主要除去甚麼？',[['Insoluble impurities','不可溶雜質'],['Dissolved salt','已溶解的鹽'],['All bacteria and viruses','所有細菌和病毒'],['Fluoride','氟化物']],'Layers trap solid particles; dissolved substances pass through.','沙石層截留固體顆粒；已溶解的物質會通過。'),
M(5,'Hikers have only a cloth and a pot over a fire. Which gives the SAFEST drinking water from a stream?','遠足人士只有一塊布和一個可在火上加熱的鍋，哪個方法可從溪水得到最安全的食水？',[['Filter through cloth, then boil the water','先用布過濾，再把水煮沸'],['Only filter through cloth','只用布過濾'],['Only let it settle','只讓它沉積'],['Drink it directly','直接飲用']],'Filtering removes solids; boiling kills microorganisms.','過濾除去固體；煮沸殺死微生物。'),
M(6,'Design a set-up to get fresh water from sea water using sunlight. Which idea works?','設計一個利用陽光從海水取得淡水的裝置，哪個構思可行？',[['A covered tray of sea water; vapour condenses on a sloped clear cover and drips into a cup','把海水放在有蓋的盤中；水汽在傾斜的透明蓋上凝結並滴入杯中'],['Filter sea water through sand many times','用沙把海水過濾多次'],['Add alum to sea water','在海水中加入明礬'],['Leave sea water in the dark','把海水放在暗處']],'This is a solar still – a mini distillation.','這是太陽能蒸餾器，即小型蒸餾。')
]},
{id:'2.5',en:'Further treatment of drinking water',zh:'食水的進一步處理',
notes:[['<b>Chlorine</b>, <b>ozone</b> and <b>ultraviolet (UV) light</b> kill microorganisms in water.','<b>氯</b>、<b>臭氧</b>和<b>紫外光</b>可以殺死水中的微生物。'],
['Adding <b>fluoride</b> (<b>fluoridation</b>) helps prevent <b>tooth decay</b>. Fluoride does <b>NOT</b> kill microorganisms.','加入<b>氟化物</b>（<b>加氟處理</b>）有助預防<b>蛀牙</b>。氟化物<b>不能</b>殺死微生物。'],
['Hong Kong <b>water treatment works</b>: <b>sedimentation → filtration → adding chlorine → fluoridation</b>.','香港<b>濾水廠</b>的處理過程：<b>沉積 → 過濾 → 加氯 → 加氟</b>。'],
['Boiling tap water also kills microorganisms.','把自來水煮沸亦可殺死微生物。']],
terms:[['chlorine','氯'],['ozone','臭氧'],['ultraviolet light','紫外光'],['fluoride','氟化物'],['fluoridation','加氟處理'],['water treatment works','濾水廠']],
qs:[
M(1,'Which substance is added to drinking water to help prevent tooth decay?','哪種物質加入食水中有助預防蛀牙？',[['Fluoride','氟化物'],['Chlorine','氯'],['Alum','明礬'],['Salt','鹽']],'Fluoridation protects teeth.','加氟處理保護牙齒。'),
M(1,'Which one does NOT kill microorganisms in water?','以下哪一項不能殺死水中的微生物？',[['Fluoride','氟化物'],['Chlorine','氯'],['Ozone','臭氧'],['Ultraviolet light','紫外光']],'Fluoride is for teeth only.','氟化物只用來保護牙齒。'),
M(1,'A place where natural water is treated to become drinking water is called a…','把天然水處理成食水的地方稱為……',[['water treatment works','濾水廠'],['sewage treatment works','污水處理廠'],['fume cupboard','通風櫥'],['reservoir only','只是水塘']],'Water treatment works produce tap water.','濾水廠生產自來水。'),
T(2,'Ultraviolet light can be used to kill microorganisms in water.','紫外光可以用來殺死水中的微生物。',true,'UV, ozone and chlorine all kill microorganisms.','紫外光、臭氧和氯都能殺死微生物。'),
T(2,'Fluoride is added to water to kill bacteria.','在水中加入氟化物是為了殺死細菌。',false,'Fluoride helps prevent tooth decay; it cannot kill microorganisms.','氟化物用來預防蛀牙，不能殺死微生物。'),
M(2,'Put the Hong Kong water treatment steps in order.','把香港濾水廠的處理步驟排序。',[['Sedimentation → filtration → adding chlorine → fluoridation','沉積 → 過濾 → 加氯 → 加氟'],['Fluoridation → filtration → sedimentation → chlorine','加氟 → 過濾 → 沉積 → 加氯'],['Adding chlorine → sedimentation → distillation','加氯 → 沉積 → 蒸餾'],['Filtration → boiling → freezing','過濾 → 煮沸 → 冷凍']],'Remove solids first, then kill microorganisms, then add fluoride.','先除去固體，再殺死微生物，最後加氟。'),
M(3,'Why is chlorine added after filtration in water treatment works?','為甚麼濾水廠在過濾後加入氯？',[['To kill harmful microorganisms that filtration cannot remove','殺死過濾不能除去的有害微生物'],['To make the water taste sweet','令水變甜'],['To remove sand','除去沙'],['To prevent tooth decay','預防蛀牙']],'Filtration cannot remove all microorganisms.','過濾不能除去所有微生物。'),
M(3,'Your tap water smells slightly like a swimming pool. This is most likely due to…','你家的自來水有點像泳池的氣味，最可能是因為……',[['chlorine added to kill microorganisms','加入了用來殺菌的氯'],['fluoride','氟化物'],['sand in the pipes','水管中的沙'],['alum','明礬']],'Swimming pools also use chlorine to kill germs.','泳池亦用氯來殺菌。'),
M(4,'Which method of killing microorganisms is best for the SMALL amount of water you drink at home?','在家中飲用的少量食水，哪個殺菌方法最適合？',[['Boiling the water','把水煮沸'],['Adding ozone gas','加入臭氧'],['Adding fluoride','加入氟化物'],['Adding alum','加入明礬']],'Boiling is simple and kills microorganisms.','煮沸方法簡單，並可殺死微生物。'),
M(4,'Why must water be clear (filtered) before UV light is used to kill germs?','為甚麼使用紫外光殺菌前，水必須清澈（已過濾）？',[['Particles block the UV light from reaching microorganisms','顆粒會阻擋紫外光照射微生物'],['UV light makes sand dissolve','紫外光會令沙溶解'],['UV light adds fluoride','紫外光會加入氟化物'],['Clear water is heavier','清水較重']],'UV must pass through the water to work.','紫外光必須穿過水才能發揮作用。'),
M(5,'Some people worry about fluoride in water. Which is the MOST balanced view?','有些人擔心食水加氟，哪個看法最平衡？',[['A small, controlled amount helps prevent tooth decay; the amount must be monitored','少量並受控的氟化物有助預防蛀牙，但份量須受監察'],['Fluoride kills all germs so more is better','氟化物殺死所有細菌，越多越好'],['Fluoride has no effect at all','氟化物完全沒有作用'],['Water should contain no treatment at all','食水不應作任何處理']],'Benefits depend on the right amount.','好處取決於適當的份量。'),
M(6,'You design a water plan for a remote village with a muddy river. Which order is BEST?','你為一條有泥河的偏遠村落設計食水方案，哪個次序最好？',[['Let it settle (with alum) → filter through sand → disinfect (chlorine or boil)','先沉積（加明礬）→ 用沙過濾 → 消毒（加氯或煮沸）'],['Add fluoride only','只加氟化物'],['Disinfect muddy water first, never filter','先為泥水消毒，永不過濾'],['Drink straight from the river','直接從河中飲水']],'Copy the treatment works: solids out first, then kill germs.','模仿濾水廠：先除去固體，再殺菌。')
]},
{id:'2.6',en:'Water conservation and pollution',zh:'節約用水和水污染',
notes:[['Fresh water is a <b>precious natural resource</b> – we should conserve it (e.g. shorter showers, fix dripping taps, reuse water).','淡水是<b>珍貴的天然資源</b>，我們應該節約用水（例如縮短淋浴時間、修理漏水的水龍頭、循環用水）。'],
['<b>Water pollution</b> is mainly caused by <b>waste water</b> from homes, farms and factories, <b>solid waste</b> (e.g. plastics, microplastics) and <b>oil spills</b>.','<b>水污染</b>主要由家居、農場和工廠的<b>污水</b>、<b>固體廢物</b>（如塑膠、微塑膠）和<b>漏油</b>造成。'],
['In Hong Kong, waste water is treated in <b>sewage treatment works</b> before discharge into the sea.','在香港，污水會先在<b>污水處理廠</b>處理，然後才排放到海中。'],
['Waste water with harmful chemicals goes to the <b>Chemical Waste Treatment Centre</b>.','含有害化學品的廢水會送往<b>化學廢物處理中心</b>處理。']],
terms:[['water conservation','節約用水'],['water pollution','水污染'],['pollutant','污染物'],['microplastic','微塑膠'],['sewage treatment works','污水處理廠']],
qs:[
M(1,'Which is a good way to conserve water?','以下哪一項是節約用水的好方法？',[['Turn off the tap while brushing teeth','刷牙時關上水龍頭'],['Take long baths every day','每天長時間浸浴'],['Wash one T-shirt in a full washing machine','用洗衣機只洗一件T恤'],['Leave a dripping tap unrepaired','不修理漏水的水龍頭']],'Small daily actions save a lot of water.','日常小行動可節省大量用水。'),
M(1,'Tiny pieces of plastic that pollute the sea are called…','污染海洋的細小塑膠碎片稱為……',[['microplastics','微塑膠'],['microorganisms','微生物'],['minerals','礦物'],['fluorides','氟化物']],'Microplastics are eaten by sea animals.','微塑膠會被海洋生物吃下。'),
M(1,'Where is waste water from homes in Hong Kong treated before going to the sea?','香港的家居污水在排入大海前在哪裏處理？',[['Sewage treatment works','污水處理廠'],['Water treatment works','濾水廠'],['Fume cupboard','通風櫥'],['Reservoir','水塘']],'Sewage treatment works clean waste water.','污水處理廠處理污水。'),
T(2,'Oil spills from ships are a cause of water pollution.','船隻漏油是水污染的成因之一。',true,'Oil covers the water and harms sea birds and fish.','油會覆蓋水面，傷害海鳥和魚類。'),
T(2,'Since the Earth has lots of water, we do not need to save fresh water.','地球有很多水，所以我們不需要節約淡水。',false,'Most water is salty sea water; fresh water is limited and precious.','大部分是鹹海水，淡水有限而珍貴。'),
M(2,'Which is a pollutant from farms?','以下哪一項是來自農場的污染物？',[['Animal waste and fertilizers','動物糞便和肥料'],['Clean rainwater','清潔的雨水'],['Fluoride','氟化物'],['Oxygen','氧']],'These wash into rivers and pollute them.','它們會被沖入河流造成污染。'),
M(3,'A factory produces waste water with harmful chemicals. It should be sent to…','一間工廠產生含有害化學品的廢水，應送往……',[['the Chemical Waste Treatment Centre','化學廢物處理中心'],['the nearest river directly','直接排入附近河流'],['a water treatment works for drinking','濾水廠製成食水'],['a playground drain','遊樂場的渠道']],'Harmful chemicals need special treatment.','有害化學品需要特別處理。'),
M(3,'Which daily habit reduces microplastic pollution?','哪個日常習慣可以減少微塑膠污染？',[['Bring your own bottle instead of buying plastic bottled drinks','自備水樽，不買膠樽飲品'],['Throw plastic bags into the sea','把膠袋扔進海裏'],['Use more disposable cutlery','多用即棄餐具'],['Burn plastic at the beach','在海灘燒塑膠']],'Less plastic waste → fewer microplastics.','塑膠廢物越少，微塑膠越少。'),
M(4,'Why is it harmful when oil covers the surface of the sea?','為甚麼油覆蓋海面會造成傷害？',[['It stops oxygen entering the water and sticks to birds\' feathers','它阻止氧進入水中，並黏在海鳥的羽毛上'],['It makes the water too cold','它令水太冷'],['It adds fluoride to the water','它把氟化物加入水中'],['It makes fish grow faster','它令魚生長得更快']],'Aquatic life needs oxygen; oily feathers cannot keep birds warm or let them fly.','水中生物需要氧；沾油的羽毛令鳥不能保暖或飛行。'),
M(4,'Using flush water from the sea for toilets in Hong Kong helps to…','香港用海水沖廁有助……',[['save fresh water','節省淡水'],['clean the sea','清潔海洋'],['add fluoride','加入氟化物'],['make drinking water','製造食水']],'Toilets do not need fresh water.','沖廁不需要淡水。'),
M(5,'Which action has the BIGGEST effect on saving water for a family?','以下哪個行動對家庭節約用水的效果最大？',[['Replacing long baths with short showers every day','每天以短時間淋浴取代長時間浸浴'],['Turning off the tap once a month','每月關一次水龍頭'],['Buying a bigger bathtub','買一個更大的浴缸'],['Washing the car daily with a hose','每天用水喉洗車']],'A daily habit that saves many litres each time.','這是每天都能節省大量用水的習慣。'),
M(6,'Plan a school campaign against water pollution. Which idea is MOST effective?','策劃一個反對水污染的學校活動，哪個構思最有效？',[['A beach clean-up plus a "bring your own bottle" week with data on plastic collected','海灘清潔加「自備水樽」週，並記錄收集的塑膠數量'],['Pour leftover paint down the drain','把剩餘油漆倒進渠道'],['Give out free plastic bottles','免費派發膠樽'],['Do nothing because one school is too small','甚麼也不做，因為一間學校太小']],'Action + measuring results shows real impact.','行動並量度成效，能顯示真正的影響。')
]}
]},
{id:3,en:'Looking at living things',zh:'觀察生物',col:'#FFF1C5',ink:'#B08A2E',icon:'leaf',sections:[
{id:'3.1',en:'Living things',zh:'生物',
notes:[['Living things carry out 7 <b>vital functions</b>: need <b>food</b>, need <b>oxygen</b>, <b>move</b>, <b>grow</b>, <b>detect and react to stimuli</b>, <b>excrete</b>, <b>reproduce</b>.','生物有七項<b>重要功能</b>：需要<b>食物</b>、需要<b>氧</b>、<b>移動</b>、<b>生長</b>、<b>察覺刺激並作出反應</b>、<b>排泄</b>、<b>生殖</b>。'],
['Living things include <b>animals</b>, <b>plants</b> and <b>microorganisms</b>.','生物包括<b>動物</b>、<b>植物</b>和<b>微生物</b>。'],
['The wide variety of living things is called <b>biodiversity</b>.','生物種類繁多，稱為<b>生物多樣性</b>。'],
['Living things vary in shape, structure and size.','生物在形狀、結構和大小上各有不同。']],
terms:[['living thing','生物'],['non-living thing','非生物'],['vital function','重要功能'],['stimulus','刺激'],['excrete','排泄'],['reproduce','生殖'],['biodiversity','生物多樣性']],
qs:[
M(1,'How many vital functions do living things carry out?','生物有多少項重要功能？',[['7','7'],['3','3'],['5','5'],['10','10']],'Food, oxygen, move, grow, stimuli, excrete, reproduce.','食物、氧、移動、生長、刺激、排泄、生殖。'),
M(1,'Removing waste made in the body is called…','把體內產生的廢物排出體外稱為……',[['excretion','排泄'],['reproduction','生殖'],['growth','生長'],['movement','移動']],'Living things excrete wastes.','生物會排泄廢物。'),
M(1,'A change in the surroundings that a living thing can detect is a…','生物可以察覺到的環境變化稱為……',[['stimulus','刺激'],['hypothesis','假說'],['solute','溶質'],['residue','殘餘物']],'E.g. light, sound, touch.','例如光、聲音、觸碰。'),
T(1,'Plants are living things.','植物是生物。',true,'Plants grow, reproduce, respond, etc.','植物會生長、生殖、作出反應等。'),
T(2,'A robot that moves and recognizes faces is a living thing.','一個會移動和認出人臉的機械人是生物。',false,'It cannot grow, reproduce or excrete, so it is non-living.','它不會生長、生殖或排泄，所以是非生物。'),
M(2,'A plant bends towards the window. Which vital function is this?','植物向窗口彎曲生長，這是哪項重要功能？',[['Detect and react to stimuli','察覺刺激並作出反應'],['Excrete','排泄'],['Reproduce','生殖'],['Need oxygen','需要氧']],'The plant detects light and responds.','植物察覺光線並作出反應。'),
M(2,'The wide variety of living things on Earth is called…','地球上生物種類繁多，這稱為……',[['biodiversity','生物多樣性'],['classification','分類'],['heredity','遺傳'],['evolution only','只是進化']],'Bio = life, diversity = variety.','生物多樣性即生命的多樣。'),
M(3,'A car moves, needs fuel and gives out waste gas. Why is it still NOT a living thing?','汽車會移動、需要燃料並排出廢氣，為甚麼它仍然不是生物？',[['It cannot grow or reproduce','它不能生長或生殖'],['It is too big','它太大'],['It is made of metal only','它只由金屬製成'],['It does not need oxygen','它不需要氧']],'A living thing must show ALL vital functions.','生物必須具備所有重要功能。'),
M(3,'Which group includes bacteria?','細菌屬於哪一類？',[['Microorganisms','微生物'],['Plants','植物'],['Mammals','哺乳類'],['Non-living things','非生物']],'Bacteria are tiny living things seen only under a microscope.','細菌是只能在顯微鏡下看到的細小生物。'),
M(4,'A seed looks dead, but it grows into a plant when watered. What does this show?','種子看似沒有生命，但澆水後會長成植物。這顯示了甚麼？',[['A seed is a living thing','種子是生物'],['Water is a living thing','水是生物'],['Seeds are non-living','種子是非生物'],['Plants do not need water','植物不需要水']],'It can grow – a vital function.','它會生長，這是重要功能之一。'),
M(5,'Which is the BEST evidence that a mushroom is a living thing?','哪個是蘑菇是生物的最佳證據？',[['It grows and reproduces by spores','它會生長並以孢子繁殖'],['It is soft','它很軟'],['It is brown','它是啡色的'],['It is found in shops','商店有售']],'Growth and reproduction are vital functions.','生長和生殖是重要功能。'),
M(6,'You design a test to find out whether "sea monkeys" in a packet are living. What would you observe?','你設計一個測試，看看包裝內的「海猴子」是否生物，你會觀察甚麼？',[['Whether they grow, move and reproduce in water over days','觀察它們在水中數天內是否會生長、移動和繁殖'],['Only their colour','只看它們的顏色'],['The price of the packet','包裝的價錢'],['Whether they float','它們是否浮起']],'Look for several vital functions over time.','觀察一段時間內是否具備多項重要功能。')
]},
{id:'3.2',en:'Grouping of living things',zh:'生物的分類',
notes:[['<b>Classification</b> groups living things by similarities in <b>key features</b>.','<b>分類</b>是根據<b>主要特徵</b>的相似之處把生物分組。'],
['Animals: <b>vertebrates</b> (with backbone) and <b>invertebrates</b> (without backbone).','動物分為<b>脊椎動物</b>（有脊柱）和<b>無脊椎動物</b>（沒有脊柱）。'],
['5 vertebrate groups: <b>fish</b> (slimy scales, gills, fins), <b>amphibians</b> (moist skin; young use gills), <b>reptiles</b> (dry scales, shelled eggs), <b>birds</b> (feathers, beak, constant body temperature), <b>mammals</b> (fur/hair, live young, mammary glands).','五類脊椎動物：<b>魚類</b>（黏滑鱗片、鰓、鰭）、<b>兩棲類</b>（濕潤皮膚；幼體用鰓）、<b>爬行類</b>（乾硬鱗片、有殼蛋）、<b>鳥類</b>（羽毛、喙、體溫恆定）、<b>哺乳類</b>（毛髮、胎生、乳腺）。'],
['Plants: <b>non-vascular</b> (e.g. moss) vs <b>vascular</b>; vascular → <b>seedless</b> (fern) or <b>seed</b>; seed → <b>non-flowering</b> (pine) or <b>flowering</b>.','植物：<b>非維管植物</b>（如苔蘚）和<b>維管植物</b>；維管植物分<b>無種子</b>（蕨）和<b>種子植物</b>；種子植物分<b>無花</b>（松）和<b>有花植物</b>。'],
['Living things have special features that <b>adapt</b> them to their <b>habitats</b>.','生物有特別的身體特徵，<b>適應</b>它們的<b>生境</b>。']],
terms:[['classification','分類'],['key feature','主要特徵'],['vertebrate','脊椎動物'],['invertebrate','無脊椎動物'],['amphibian','兩棲類'],['reptile','爬行類'],['mammal','哺乳類'],['vascular plant','維管植物'],['flowering plant','有花植物'],['habitat','生境']],
qs:[
M(1,'Animals WITH a backbone are called…','有脊柱的動物稱為……',[['vertebrates','脊椎動物'],['invertebrates','無脊椎動物'],['microorganisms','微生物'],['amphibians only','只是兩棲類']],'Vertebrate = backbone.','脊椎動物＝有脊柱。'),
M(1,'Which animal group has feathers?','哪類動物有羽毛？',[['Birds','鳥類'],['Reptiles','爬行類'],['Mammals','哺乳類'],['Fish','魚類']],'Only birds have feathers.','只有鳥類有羽毛。'),
M(1,'Fish breathe with…','魚用甚麼呼吸？',[['gills','鰓'],['lungs','肺'],['skin only','只用皮膚'],['feathers','羽毛']],'Gills take oxygen from water.','鰓從水中吸取氧。'),
T(2,'A butterfly is an invertebrate.','蝴蝶是無脊椎動物。',true,'Insects have no backbone.','昆蟲沒有脊柱。'),
T(2,'Reptiles keep a constant body temperature.','爬行類的體溫保持恆定。',false,'Only birds and mammals keep a constant body temperature.','只有鳥類和哺乳類的體溫恆定。'),
M(2,'Which plant has vascular tissues but does NOT produce seeds?','哪種植物有維管組織但不產生種子？',[['Fern','蕨'],['Moss','苔蘚'],['Pine','松樹'],['Apple tree','蘋果樹']],'Ferns reproduce by spores.','蕨以孢子繁殖。'),
M(2,'A frog is an amphibian because…','青蛙是兩棲類，因為……',[['its young live in water with gills; adults live on land with lungs','幼體在水中用鰓呼吸，成體在陸上用肺呼吸'],['it has feathers','它有羽毛'],['it gives birth to live young','它是胎生的'],['it has dry scales','它有乾硬的鱗片']],'Amphibian = double life.','兩棲＝兩種生活方式。'),
M(3,'A bat has wings and flies. It has fur and feeds milk to its young. It is a…','蝙蝠有翼會飛，有毛髮並以乳汁餵哺幼兒。它屬於……',[['mammal','哺乳類'],['bird','鳥類'],['reptile','爬行類'],['insect','昆蟲']],'Fur + milk = mammal. Its wings are modified forelimbs.','有毛髮＋餵乳＝哺乳類。它的翼是變異的前肢。'),
M(3,'A whale lives in the sea. Which feature shows it is NOT a fish?','鯨生活在海中，哪個特徵顯示它不是魚類？',[['It breathes with lungs and gives birth to live young','它用肺呼吸並且是胎生的'],['It swims','它會游泳'],['It has fins-like flippers','它有像鰭的鰭肢'],['It lives in water','它生活在水中']],'Whales are mammals.','鯨是哺乳類。'),
M(4,'An animal has dry hard scales and lays shelled eggs on land. Which group?','一種動物有乾硬的鱗片，並在陸上產有殼的蛋。它屬於哪類？',[['Reptile','爬行類'],['Fish','魚類'],['Amphibian','兩棲類'],['Mammal','哺乳類']],'E.g. turtles, snakes, lizards.','例如龜、蛇、蜥蜴。'),
M(4,'A polar bear has thick fur and a layer of fat. These help it adapt to…','北極熊有厚毛和脂肪層，這些特徵幫助它適應……',[['a very cold habitat','非常寒冷的生境'],['a hot desert','炎熱的沙漠'],['life in fresh water','淡水生活'],['flying','飛行']],'Fur and fat keep it warm.','毛和脂肪幫助保暖。'),
M(5,'Sam groups a penguin with fish because it swims. Is this a good classification?','Sam 因為企鵝會游泳而把牠歸入魚類，這分類好嗎？',[['No – it has feathers and a beak, so it is a bird','不好－牠有羽毛和喙，所以是鳥類'],['Yes – swimming is the key feature','好－游泳是主要特徵'],['Yes – it lives near water','好－牠住在水邊'],['No – it is a mammal','不好－牠是哺乳類']],'Classify by key body features, not behaviour.','應根據主要身體特徵分類，而不是行為。'),
M(6,'Design a cactus-like plant for a hot desert. Which set of features fits BEST?','為炎熱沙漠設計一種像仙人掌的植物，哪組特徵最合適？',[['Spines instead of leaves, thick stem storing water, long roots','以刺代葉、能儲水的粗莖、長根'],['Big thin leaves and short roots','大而薄的葉和短根'],['No roots and floating leaves','沒有根和浮葉'],['Soft stem with no water storage','不能儲水的軟莖']],'Reduce water loss and store water.','減少失水並儲存水分。')
]},
{id:'3.3',en:'Identification key',zh:'檢索表',
notes:[['A <b>key</b> helps us identify living things by their body features.','<b>檢索表</b>幫助我們根據身體特徵辨認生物。'],
['Each level gives <b>two alternative features</b>; choose one at each step until you reach a name.','每一層提供<b>兩個對立的特徵</b>；每一步選擇其一，直至得出名稱。'],
['Keys can be drawn as a <b>tree diagram</b> or written as <b>numbered statements</b>.','檢索表可以畫成<b>樹狀圖</b>或寫成<b>編號句子</b>。'],
['When making a key, use <b>observable</b> features (e.g. "has tails on wings"), not size words like "big" or "pretty" that are opinions.','製作檢索表時，應使用<b>可觀察</b>的特徵（例如「翅膀有尾突」），避免使用「大」、「漂亮」等主觀字眼。']],
terms:[['key','檢索表'],['feature','特徵'],['tree diagram','樹狀圖'],['identify','辨認']],
qs:[
M(1,'What is an identification key used for?','檢索表有甚麼用途？',[['Identifying living things by their features','根據特徵辨認生物'],['Opening locked doors','打開上鎖的門'],['Measuring volume','量度體積'],['Killing microorganisms','殺死微生物']],'Keys help scientists name unfamiliar living things.','檢索表幫助科學家辨認不熟悉的生物。'),
M(1,'At each level of a simple key, how many alternatives are given?','在簡單的檢索表中，每一層提供多少個選擇？',[['Two','兩個'],['One','一個'],['Five','五個'],['Ten','十個']],'Two opposite features, e.g. "has wings / has no wings".','兩個對立的特徵，例如「有翼／沒有翼」。'),
T(2,'A key can be written as numbered statements instead of a tree diagram.','檢索表可以寫成編號句子，而不一定是樹狀圖。',true,'Both forms work the same way.','兩種形式的原理相同。'),
T(2,'"Is it cute?" is a good question to use in a key.','「牠可愛嗎？」是檢索表中的好問題。',false,'"Cute" is an opinion – different people give different answers.','「可愛」是主觀意見，不同人會有不同答案。'),
M(2,'Which is the BEST feature to use in a key for leaves?','在葉的檢索表中，哪個特徵最適合使用？',[['Leaf edge is smooth / toothed','葉緣光滑／有鋸齒'],['Leaf is beautiful / ugly','葉漂亮／醜陋'],['Leaf is my favourite / not','是我喜歡的葉／不是'],['Leaf smells nice / not nice','葉好香／不香']],'Observable, clear features avoid confusion.','清晰可觀察的特徵可避免混淆。'),
M(3,'Key: 1a Has tails on wings → Paris Peacock; 1b No tails → go to 2. 2a Black eyespots → Common Five-ring; 2b No eyespots → go to 3. A butterfly has no tails but has black eyespots. It is…','檢索表：1a 翅膀有尾突 → 巴黎翠鳳蝶；1b 沒有尾突 → 到 2。2a 有黑色眼斑 → 矍眼蝶；2b 沒有眼斑 → 到 3。一隻蝴蝶沒有尾突但有黑色眼斑，牠是……',[['Common Five-ring','矍眼蝶'],['Paris Peacock','巴黎翠鳳蝶'],['Common Lascar','金蟠蛺蝶'],['Yellow Orange Tip','橙粉蝶']],'1b → 2a.','1b → 2a。'),
M(3,'Same key, 3a Has stripes → Common Lascar; 3b No stripes → Yellow Orange Tip. A butterfly has no tails, no eyespots and has stripes. It is…','同一檢索表，3a 有條紋 → 金蟠蛺蝶；3b 沒有條紋 → 橙粉蝶。一隻蝴蝶沒有尾突、沒有眼斑、有條紋，牠是……',[['Common Lascar','金蟠蛺蝶'],['Yellow Orange Tip','橙粉蝶'],['Paris Peacock','巴黎翠鳳蝶'],['Common Five-ring','矍眼蝶']],'1b → 2b → 3a.','1b → 2b → 3a。'),
M(3,'Key: 1a Has 6 legs → insect; 1b Has 8 legs → spider. An animal has 8 legs. It is…','檢索表：1a 有 6 隻腳 → 昆蟲；1b 有 8 隻腳 → 蜘蛛。一種動物有 8 隻腳，牠是……',[['a spider','蜘蛛'],['an insect','昆蟲'],['a bird','鳥'],['a fish','魚']],'Follow 1b.','依照 1b。'),
M(4,'To make a key for 4 fish, how many questions (levels) are needed at LEAST?','為 4 種魚製作檢索表，最少需要多少個問題？',[['3','3'],['1','1'],['2','2'],['4','4']],'Each question separates one group into two; 4 organisms need 3 splits.','每個問題把一組分成兩組；4 種生物需要分 3 次。'),
M(4,'A key question "Has stripes?" splits 4 fish into 1 and 3. What should the next question do?','檢索表問題「有條紋嗎？」把 4 條魚分成 1 條和 3 條。下一個問題應該做甚麼？',[['Split the group of 3 into smaller groups','把 3 條魚那組再分成更小的組'],['Split the single fish','把單獨那條魚再分'],['Ask the same question again','重複同一問題'],['Stop the key','停止製作檢索表']],'Keep dividing until each fish is alone.','繼續分組，直至每條魚都被分開。'),
M(5,'Which key question is WEAKEST?','哪個檢索表問題最弱？',[['Is it big?','牠大嗎？'],['Does it have 8 legs?','牠有 8 隻腳嗎？'],['Does it have feathers?','牠有羽毛嗎？'],['Does it have a shell?','牠有殼嗎？']],'"Big" compared with what? It is not clear.','「大」是和甚麼比較？意思不清晰。'),
M(6,'Make a key for: cat, sparrow, goldfish, snake. Which FIRST question splits them into 2 + 2?','為貓、麻雀、金魚、蛇製作檢索表，哪個第一個問題可以把牠們分成 2＋2？',[['Does it have legs?','牠有腳嗎？'],['Does it have feathers?','牠有羽毛嗎？'],['Does it have fur?','牠有毛髮嗎？'],['Is it a pet?','牠是寵物嗎？']],'Legs: cat, sparrow / No legs: goldfish, snake.','有腳：貓、麻雀／沒有腳：金魚、蛇。')
]},
{id:'3.4',en:'Biodiversity',zh:'生物多樣性',
notes:[['Biodiversity keeps nature in <b>balance</b> and makes it more <b>sustainable</b>.','生物多樣性維持大自然的<b>平衡</b>，令環境更可<b>持續</b>。'],
['It gives humans <b>food</b>, <b>raw materials</b> and <b>medicines</b>.','它為人類提供<b>食物</b>、<b>原材料</b>和<b>藥物</b>。'],
['Species in danger of dying out are <b>endangered species</b>; when all die they become <b>extinct</b>.','面臨滅絕危機的物種稱為<b>瀕危物種</b>；全部死亡便會<b>滅絕</b>。'],
['Threats: <b>habitat destruction</b>, <b>overhunting & overexploitation</b>, <b>foreign species</b>, <b>pollution</b>.','威脅：<b>破壞生境</b>、<b>過度獵殺及過度開發</b>、<b>引入外來物種</b>、<b>污染</b>。'],
['<b>Conservation</b> by governments (country parks, laws) and individuals (4 Rs: Reduce, Reuse, Recycle, Replace).','政府（郊野公園、法例）和個人（4R：減少使用、物盡其用、循環再造、替代使用）共同進行<b>保育</b>。'],
['HK examples: Romer\'s Tree Frog, Chinese White Dolphin, Black-faced Spoonbill.','香港例子：盧氏小樹蛙、中華白海豚、黑臉琵鷺。']],
terms:[['sustainable development','可持續發展'],['extinct','滅絕'],['endangered species','瀕危物種'],['overhunted','過度獵殺'],['foreign species','外來物種'],['native species','原生物種'],['conservation','保育'],['pollution','污染']],
qs:[
M(1,'Living things in danger of extinction are called…','面臨滅絕危機的生物稱為……',[['endangered species','瀕危物種'],['foreign species','外來物種'],['native species','原生物種'],['microorganisms','微生物']],'Endangered = at risk of dying out.','瀕危＝有滅絕的風險。'),
M(1,'Which is a Hong Kong endangered animal?','以下哪一種是香港的瀕危動物？',[['Chinese White Dolphin','中華白海豚'],['House sparrow','家麻雀'],['Pet goldfish','寵物金魚'],['Pigeon','白鴿']],'Also Romer\'s Tree Frog and Black-faced Spoonbill.','還有盧氏小樹蛙和黑臉琵鷺。'),
T(1,'Many medicines come from plants and other living things.','很多藥物來自植物和其他生物。',true,'Biodiversity provides medicines, e.g. artemisinin from a plant.','生物多樣性提供藥物，例如從植物提取的青蒿素。'),
T(2,'Introducing foreign species never harms native species.','引入外來物種從不會傷害原生物種。',false,'Foreign species may compete with or eat native species.','外來物種可能與原生物種競爭或捕食牠們。'),
M(2,'Which human activity threatens biodiversity?','以下哪種人類活動威脅生物多樣性？',[['Cutting down forests for buildings','砍伐森林興建樓宇'],['Setting up country parks','設立郊野公園'],['Recycling paper','回收廢紙'],['Planting native trees','種植原生樹木']],'Habitat destruction removes homes of living things.','破壞生境令生物失去居所。'),
M(2,'What does the 4 Rs principle stand for?','4R 原則代表甚麼？',[['Reduce, Reuse, Recycle, Replace','減少使用、物盡其用、循環再造、替代使用'],['Read, Write, Run, Rest','閱讀、寫作、跑步、休息'],['Rain, River, Rock, Root','雨、河、石、根'],['Remove, Refill, Return, Rebuild','移除、補充、歸還、重建']],'Individuals can practise the 4 Rs daily.','個人可在日常生活實踐 4R。'),
M(3,'Fishermen catch so many fish that the population cannot recover. This is…','漁民捕獲太多魚，令魚群數目無法回復，這是……',[['overexploitation','過度開發'],['conservation','保育'],['pollution','污染'],['classification','分類']],'Using a resource faster than it can be replaced.','使用資源的速度快過它能補充的速度。'),
M(3,'Which is a role of the GOVERNMENT in conservation?','以下哪一項是政府在保育方面的角色？',[['Making laws to protect wild animals and setting up marine parks','訂立法例保護野生動物及設立海岸公園'],['Bringing your own shopping bag','自備購物袋'],['Turning off lights at home','在家關燈'],['Buying fewer clothes','少買衣服']],'Governments make laws and protected areas.','政府訂立法例和設立保護區。'),
M(4,'If bees became extinct, which is the MOST likely result?','如果蜜蜂滅絕，最可能出現甚麼後果？',[['Many flowering plants and crops could not be pollinated','很多有花植物和農作物無法傳粉'],['There would be more fruits','會有更多果實'],['Nothing would change','甚麼也不會改變'],['Rivers would dry up','河流會乾涸']],'Living things depend on one another – losing one affects others.','生物互相依賴，失去一種會影響其他生物。'),
M(4,'Why does higher biodiversity make an ecosystem more stable?','為甚麼生物多樣性較高會令生態系統較穩定？',[['If one species declines, others can fill its role','如果一種生物減少，其他生物可以取代牠的角色'],['There are fewer living things','生物較少'],['Pollution stops','污染會停止'],['All animals eat the same food','所有動物吃同一種食物']],'More variety = more backup.','種類越多，後備越多。'),
M(5,'A new road is planned through a stream where Romer\'s Tree Frogs live. Which is the BEST decision?','計劃興建一條穿過盧氏小樹蛙棲息溪流的新道路，哪個決定最好？',[['Change the route or build protected passages, and conduct an environmental study first','改道或建造保護通道，並先進行環境評估'],['Build the road anyway','照樣興建道路'],['Move all frogs into tanks forever','把所有青蛙永遠放入水族箱'],['Fill the stream with concrete','用混凝土填平溪流']],'Balance development with conservation – sustainable development.','平衡發展和保育，即可持續發展。'),
M(6,'Plan a class project to help the Black-faced Spoonbill. Which is MOST useful?','策劃一個幫助黑臉琵鷺的班級專題，哪個最有用？',[['Research its threats, share findings, and support wetland protection (e.g. Mai Po)','研究牠面對的威脅，分享結果，並支持保護濕地（例如米埔）'],['Catch one as a class pet','捉一隻當班寵'],['Feed it bread at the beach','在海灘餵牠麵包'],['Ignore it because it is only a bird','不理會，因為牠只是一隻鳥']],'Knowledge + protecting habitats helps most.','知識加上保護生境最有幫助。')
]}
]},

{id:'4.1',en:'Cells',zh:'細胞',
notes:[['<b>Cells</b> are the basic units of living things.','<b>細胞</b>是生物的基本單位。'],
['Total magnification = <b>eyepiece × objective</b>. The image in a light microscope is <b>magnified and inverted</b>.','總放大率＝<b>目鏡放大率 × 物鏡放大率</b>。光學顯微鏡的影像是<b>放大及倒轉</b>的。'],
['Both plant & animal cells: <b>cell membrane</b> (controls substances in/out), <b>cytoplasm</b> (chemical reactions), <b>nucleus</b> (genetic material, controls activities).','植物和動物細胞都有：<b>細胞膜</b>（控制物質進出）、<b>細胞質</b>（進行化學反應）、<b>細胞核</b>（含遺傳物質，控制細胞活動）。'],
['Plant cells only: <b>cell wall</b> (support, regular shape), <b>large vacuole</b>, <b>chloroplasts</b> (chlorophyll, photosynthesis; in green parts).','只有植物細胞有：<b>細胞壁</b>（支持、形狀規則）、<b>大液泡</b>、<b>葉綠體</b>（含葉綠素，進行光合作用；在綠色部分）。']],
terms:[['cell','細胞'],['microscope','顯微鏡'],['magnification','放大率'],['cell wall','細胞壁'],['cell membrane','細胞膜'],['cytoplasm','細胞質'],['nucleus','細胞核'],['vacuole','液泡'],['chloroplast','葉綠體']],
qs:[
M(1,'What are the basic units of living things?','生物的基本單位是甚麼？',[['Cells','細胞'],['Atoms of water','水分子'],['Organs','器官'],['Bones','骨骼']],'All living things are made of cells.','所有生物都由細胞組成。'),

M(1,'Where does photosynthesis take place?','光合作用在哪裏進行？',[['Chloroplasts','葉綠體'],['Nucleus','細胞核'],['Cell membrane','細胞膜'],['Vacuole','液泡']],'Chloroplasts contain chlorophyll.','葉綠體含有葉綠素。'),
